// Calendario por jornadas (método del círculo). Con número impar, cada jornada descansa uno.
function roundRobin(n, laps){
  const t=[...Array(n).keys()]; if(n%2) t.push(-1);
  const R=t.length-1, half=t.length/2, ida=[];
  let arr=[...t];
  for(let r=0;r<R;r++){
    const round=[];
    for(let i=0;i<half;i++){ const x=arr[i], y=arr[arr.length-1-i]; if(x<0||y<0) continue; round.push(r%2?[y,x]:[x,y]); }
    ida.push(round);
    arr=[arr[0], arr[arr.length-1], ...arr.slice(1,-1)];
  }
  const rounds=[]; for(let l=0;l<laps;l++) ida.forEach(rd=>rounds.push(rd.map(([h,a])=>l%2?[a,h]:[h,a])));
  const fx=[]; rounds.forEach((rd,j)=>rd.forEach(([h,a])=>fx.push({h,a,j:j+1,res:null})));
  return fx;
}
function power(i){
  const R=S.m[i].roster, g=pos=>R.filter(x=>x.pos===pos).map(x=>x.r);
  const dt=g("DT")[0], bonus=(dt-80)*0.15;
  return {
    att: 0.6*avg(g("DEL")) + 0.4*avg(g("MED")) + bonus,
    def: 0.4*g("POR")[0] + 0.45*avg(g("DEF")) + 0.15*avg(g("MED")) + bonus,
    ovr: avg(R.map(x=>x.r))
  };
}
function poisson(l){ let L=Math.exp(-l),k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }
function scorer(i){
  const W={DEL:5,MED:2.4,DEF:0.8,POR:0,DT:0};
  const pool=S.m[i].roster.filter(x=>W[x.pos]>0).map(x=>({n:x.n,w:W[x.pos]*Math.pow(x.r/80,3)}));
  let t=pool.reduce((s,x)=>s+x.w,0)*Math.random();
  for(const x of pool){ if((t-=x.w)<=0) return x.n; } return pool[0].n;
}
function lambdas(h,a,neutral){
  const H=power(h), A=power(a);
  return [Math.min(4,Math.max(.2,1.3*Math.exp((H.att-A.def)/7)+(neutral?0:.2))),
          Math.min(4,Math.max(.2,1.3*Math.exp((A.att-H.def)/7)))];
}
const goals=(t,lam,from,to)=>Array.from({length:poisson(lam)},()=>({m:from+Math.floor(Math.random()*(to-from+1)),n:scorer(t)}));
const byMin=(a,b)=>a.m-b.m;
function playMatch(f){
  const [lh,la]=lambdas(f.h,f.a,false);
  const sh=goals(f.h,lh,1,90).sort(byMin), sa=goals(f.a,la,1,90).sort(byMin);
  f.res={gh:sh.length,ga:sa.length,sh,sa};
}
// Desempate: partido en campo neutral, prórroga y penaltis si hace falta
function shootout(h,a){
  const gk=i=>S.m[i].roster.find(x=>x.pos==="POR").r;
  const pH=Math.min(.9,Math.max(.6,.76-(gk(a)-80)*.006)), pA=Math.min(.9,Math.max(.6,.76-(gk(h)-80)*.006));
  const H=[],A=[],sum=x=>x.filter(Boolean).length;
  const decided=()=>sum(H)>sum(A)+(5-A.length)||sum(A)>sum(H)+(5-H.length);
  for(let r=0;r<5;r++){ H.push(Math.random()<pH); if(decided())break; A.push(Math.random()<pA); if(decided())break; }
  if(!decided()) do{ H.push(Math.random()<pH); A.push(Math.random()<pA); }while(sum(H)===sum(A));
  return {H,A,winner:sum(H)>sum(A)?h:a};
}
function playPlayoff(){
  const P=S.playoff, [lh,la]=lambdas(P.h,P.a,true);
  let sh=goals(P.h,lh,1,90), sa=goals(P.a,la,1,90), et=false, pens=null;
  if(sh.length===sa.length){ et=true; sh=sh.concat(goals(P.h,lh/3,91,120)); sa=sa.concat(goals(P.a,la/3,91,120)); }
  if(sh.length===sa.length) pens=shootout(P.h,P.a);
  sh.sort(byMin); sa.sort(byMin);
  P.res={gh:sh.length,ga:sa.length,sh,sa,et,pens};
  P.winner=sh.length>sa.length?P.h:sa.length>sh.length?P.a:pens.winner;
  save(); renderLeague();
}

    <div class="gl"><div>${r.sh.map(g=>`${esc(g.n)} ${g.m}'`).join("<br>")}</div><div>${r.sa.map(g=>`${g.m}' ${esc(g.n)}`).join("<br>")}</div></div></div>
    ${r.pens?`<div class="gl" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:var(--f-mono)"><div style="text-align:right">${dots(r.pens.H)} · ${r.pens.H.filter(Boolean).length}</div><div>${r.pens.A.filter(Boolean).length} · ${dots(r.pens.A)}</div></div>`:""}

function playJornada(){

function standings(){
  const T=S.m.map((_,i)=>({i,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));
  S.fx.filter(finished).forEach(f=>{
    const h=T[f.h],a=T[f.a],{gh,ga}=f.res;
    h.pj++;a.pj++;h.gf+=gh;h.gc+=ga;a.gf+=ga;a.gc+=gh;
    if(gh>ga){h.g++;h.pts+=3;a.p++;} else if(gh<ga){a.g++;a.pts+=3;h.p++;} else {h.e++;a.e++;h.pts++;a.pts++;}
  });
  return T.sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf);
}
function scorers(){

// Fase 1: cuerpo y altura · 2: peinado, barba y detalles · 3: dorsal y pierna buena · 4: nacionalidad
const HAIR_TXT = {calvo:"calvo",rapado:"rapado",corto:"pelo corto",rizos:"rizos",afro:"afro",largo:"melena larga",coleta:"coleta",cresta:"cresta",rastas:"rastas"};
const ACC_TXT = {gafas:"gafas",cuello:"cuello de la camiseta subido",puro:"puro",libreta:"libreta en la mano"};
const FOOT_TXT = {der:"derecha",izq:"izquierda",ambas:"las dos"};
function siluSVG(p, st){
  const s=p.s, F="#0f2219", C="#eef4ec", u=230*(s.h/185)/8, w={fino:.86,normal:1,fuerte:1.18}[s.b]||1, x=100, top=292-8*u;
  const hr=.5*u, hy=top+hr, shY=top+1.45*u, sw=1.05*u*w, ww=.78*u*w, waY=top+(p.pos==="DT"?4.3:3.6)*u, hipY=top+4.6*u;
  const legW=.34*u*w, legX=.36*u*w, foot=292;
  const o=[];
  // pelo detrás de la cabeza (afro, largo, rastas, coleta)
  if(st>=2){
    if(s.hair==="afro") o.push(`<circle cx="${x}" cy="${hy-hr*.35}" r="${hr*1.75}" fill="${F}"/>`);
    if(s.hair==="largo") o.push(`<rect x="${x-hr*1.15}" y="${hy-hr*.6}" width="${hr*2.3}" height="${hr*2.4}" rx="${hr*.6}" fill="${F}"/>`);
    if(s.hair==="coleta") o.push(`<ellipse cx="${x+hr*1.25}" cy="${hy+hr*.25}" rx="${hr*.32}" ry="${hr*.95}" transform="rotate(-20 ${x+hr*1.25} ${hy+hr*.25})" fill="${F}"/>`);
    if(s.hair==="rastas") for(let i=-4;i<=4;i++) o.push(`<line x1="${x+i*hr*.25}" y1="${hy-hr*.5}" x2="${x+i*hr*.38}" y2="${hy+hr*(1.6+Math.abs(i)*.05)}" stroke="${F}" stroke-width="${hr*.22}" stroke-linecap="round"/>`);
  }
  // brazos, piernas, botas
  [-1,1].forEach(d=>{
    o.push(`<line x1="${x+d*sw*.92}" y1="${shY+.15*u}" x2="${x+d*(sw+.42*u)}" y2="${top+4.15*u}" stroke="${F}" stroke-width="${.34*u*w}" stroke-linecap="round"/>`);
    o.push(`<rect x="${x+d*legX-legW/2}" y="${hipY-.2*u}" width="${legW}" height="${foot-hipY-.05*u}" rx="${legW*.4}" fill="${F}"/>`);
    o.push(`<ellipse cx="${x+d*legX+d*.08*u}" cy="${foot-.08*u}" rx="${legW*.75}" ry="${.16*u}" fill="${F}"/>`);
    if(p.pos==="POR") o.push(`<circle cx="${x+d*(sw+.42*u)}" cy="${top+4.2*u}" r="${.27*u}" fill="${F}"/>`);
  });
  // cuello, torso, pantalón
  o.push(`<rect x="${x-hr*.42}" y="${hy+hr*.6}" width="${hr*.84}" height="${shY-hy}" fill="${F}"/>`);
  o.push(`<path d="M${x-sw},${shY} L${x+sw},${shY} L${x+ww},${waY} L${x-ww},${waY} Z" fill="${F}" stroke="${F}" stroke-width="${.3*u}" stroke-linejoin="round"/>`);
  if(p.pos!=="DT") o.push(`<rect x="${x-ww*1.06}" y="${waY-.05*u}" width="${ww*2.12}" height="${hipY-waY+.3*u}" rx="${.12*u}" fill="${F}"/>`);
  // cabeza y pelo por encima
  o.push(`<circle cx="${x}" cy="${hy}" r="${hr}" fill="${F}"/>`);
  if(st>=2){
    const cap=(ry,dy)=>o.push(`<ellipse cx="${x}" cy="${hy-hr*dy}" rx="${hr*1.06}" ry="${hr*ry}" fill="${F}"/>`);
    if(s.hair==="rapado") cap(.62,.32);
    if(["corto","largo","coleta","rastas"].includes(s.hair)) cap(.75,.45);
    if(s.hair==="rizos") for(let a=-170;a<=-10;a+=32){ const r=a*Math.PI/180; o.push(`<circle cx="${x+Math.cos(r)*hr*.95}" cy="${hy+Math.sin(r)*hr*.95}" r="${hr*.38}" fill="${F}"/>`); }
    if(s.hair==="cresta") o.push(`<ellipse cx="${x}" cy="${hy-hr*1.05}" rx="${hr*.28}" ry="${hr*.85}" fill="${F}"/>`);
    if(s.beard) o.push(`<ellipse cx="${x}" cy="${hy+hr*.8}" rx="${hr*(s.beard>1?.72:.55)}" ry="${hr*(s.beard>1?.48:.3)}" fill="${F}"/>`);
    if(s.acc==="gafas") o.push(`<g fill="none" stroke="${C}" stroke-width="1.6"><circle cx="${x-hr*.42}" cy="${hy-hr*.05}" r="${hr*.3}"/><circle cx="${x+hr*.42}" cy="${hy-hr*.05}" r="${hr*.3}"/><line x1="${x-hr*.12}" y1="${hy-hr*.05}" x2="${x+hr*.12}" y2="${hy-hr*.05}"/></g>`);
    if(s.acc==="cuello") o.push(`<path d="M${x-hr*.95},${shY+.05*u} L${x-hr*.45},${hy+hr*.35} L${x},${shY+.25*u} L${x+hr*.45},${hy+hr*.35} L${x+hr*.95},${shY+.05*u}" fill="${F}" stroke="${C}" stroke-width="1.4"/>`);
    if(s.acc==="puro") o.push(`<line x1="${x+hr*.2}" y1="${hy+hr*.5}" x2="${x+hr*1.1}" y2="${hy+hr*.62}" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`);
    if(s.acc==="libreta") o.push(`<rect x="${x+sw+.2*u}" y="${top+3.7*u}" width="${.5*u}" height="${.65*u}" fill="${C}" stroke="${F}" stroke-width="1.5"/>`);
  }
  if(p.pos==="DT") o.push(`<line x1="${x}" y1="${shY+.1*u}" x2="${x}" y2="${top+3*u}" stroke="${C}" stroke-width="${.13*u}" stroke-linecap="round"/>`);
  if(st>=3&&p.pos!=="DT"){
    o.push(`<text x="${x}" y="${top+3*u}" text-anchor="middle" font-family="Chivo Mono,monospace" font-weight="700" font-size="${1.05*u}" fill="${C}">${s.num??"?"}</text>`);
    const bx = s.foot==="izq" ? x+legX+.75*u : x-legX-.75*u;  // vista de frente: su izquierda queda a nuestra derecha
    if(s.foot!=="ambas") o.push(`<circle cx="${bx}" cy="${foot-.3*u}" r="${.32*u}" fill="${C}" stroke="${F}" stroke-width="2"/>`);
  }
  return `<svg class="silu" viewBox="0 0 200 300" role="img" aria-label="Silueta del ${p.pos==="DT"?"entrenador":"jugador"}">${o.join("")}</svg>`;
}
function siluHTML(p, st){
  const s=p.s, f=[`<li><b>Altura</b> ${(s.h/100).toFixed(2).replace(".",",")} m · complexión ${s.b}</li>`];
  f.push(st>=2?`<li><b>Look</b> ${HAIR_TXT[s.hair]}${s.beard?(s.beard>1?", barba":", barba de pocos días"):""}${s.acc?", "+ACC_TXT[s.acc]:""}</li>`:`<li class="hidden">Peinado y detalles ocultos</li>`);
  if(p.pos!=="DT") f.push(st>=3?`<li><b>Dorsal</b> ${s.num??"varió mucho"} · pierna buena: ${FOOT_TXT[s.foot]}</li>`:`<li class="hidden">Dorsal y pierna buena ocultos</li>`);
  f.push(st>=4?`<li><b>País</b> ${esc(s.nat)}</li>`:`<li class="hidden">Nacionalidad oculta</li>`);
  return `<div class="siluwrap">${siluSVG(p,st)}<ul class="silufacts">${f.join("")}</ul></div>`;
}

const TICK_MS = 230;
let liveTimer = null;
const finished = f => f.res && !f.live;
const TXT = {
  g:["¡GOOOL de {n}!","¡{n} la manda a la red!","¡Golazo de {n}! La grada se viene abajo.","¡{n} no perdona!"],
  f:["{n} dispara… fuera por poco.","Disparo de {n} que se marcha alto.","{n} lo intenta desde lejos. Ni cerca.","Cabezazo de {n} que se va desviado."],
  s:["¡Paradón! El portero le saca el tiro a {n}.","{n} remata y el portero atrapa sin problemas.","Mano a mano de {n}… ¡y para el portero!"],
  p:["¡Al palo! {n} se queda con la miel en los labios.","¡Larguero! El disparo de {n} hace temblar la portería."],
  a:["Amarilla para {n} por protestar.","Tarjeta para {n} tras una entrada a destiempo.","{n} ve la amarilla por perder tiempo."],
};
function commentary(e){ const v=TXT[e[1]]; return v[(e[0]+String(e[3]).length)%v.length].replace("{n}",esc(e[3])); }
function buildTimeline(f){
  const H=power(f.h), A=power(f.a), r=f.res, tl=[];
  r.sh.forEach(g=>tl.push([g.m,"g",0,g.n])); r.sa.forEach(g=>tl.push([g.m,"g",1,g.n]));
  [[0,f.h,H,A],[1,f.a,A,H]].forEach(([side,t,P,O])=>{
    for(let i=poisson(Math.max(1.5,4+(P.att-O.def)/4));i>0;i--) tl.push([1+Math.floor(Math.random()*90),pickR(["f","f","s","s","p"]),side,scorer(t)]);
    const pool=S.m[t].roster.filter(x=>x.pos!=="POR"&&x.pos!=="DT");
    for(let i=poisson(1.6);i>0;i--) tl.push([1+Math.floor(Math.random()*90),"a",side,pickR(pool).n]);
  });
  tl.sort((a,b)=>a[0]-b[0]);
  const mid=t=>avg(S.m[t].roster.filter(x=>x.pos==="MED").map(x=>x.r));
  r.tl=tl; r.pos=Math.round(Math.max(32,Math.min(68,50+(mid(f.h)-mid(f.a))*1.4+(Math.random()-.5)*8)));
}
function startLive(ms){
  S.live={j:S.fx[ms[0]].j, ms, min:0, speed:1, pause:0, ended:false};
  ms.forEach(k=>{ buildTimeline(S.fx[k]); S.fx[k].live=true; });
  runLive();
}
function runLive(){
  clearInterval(liveTimer); liveTimer=null;
  if(NET.role==="client"||!S.live||S.live.ended) return;
  liveTimer=setInterval(()=>{
    const L=S.live; if(!L||L.ended){ clearInterval(liveTimer); return; }
    if(L.pause>0) L.pause--;
    else { L.min++; if(L.min===45) L.pause=8; }
    if(L.min>=90) return endLive();
    save(); renderLeague();
  }, TICK_MS/S.live.speed);
}
function endLive(){
  clearInterval(liveTimer); liveTimer=null;
  const L=S.live; if(!L) return;
  L.min=90; L.ended=true; L.pause=0;
  L.ms.forEach(k=>{ S.fx[k].live=false; });
  if(S.played>=S.fx.length) S.phase="final";
  save(); renderLeague();
}
function closeLive(){
  if(!S.live) return;
  if(!S.live.ended) endLive();
  S.live.ms.forEach(k=>{ const r=S.fx[k].res; if(r){ delete r.tl; delete r.pos; } });
  S.live=null; save(); renderLeague();
}
function liveSpeed(){ if(!S.live||S.live.ended) return; S.live.speed=S.live.speed===1?3:1; save(); runLive(); renderLeague(); }
function liveHTML(){
  const L=S.live, m=L.min, n=i=>esc(S.names[i]);
  const cards=L.ms.map((k,ci)=>{
    const f=S.fx[k], r=f.res, vis=(r.tl||[]).filter(e=>e[0]<=m);
    const cnt=(type,side)=>vis.filter(e=>(type.includes(e[1]))&&e[2]===side).length;
    const gh=cnt("g",0), ga=cnt("g",1);
    // el balón va hacia la portería del que acaba de llegar; si no, deambula según la posesión
    const last=[...vis].reverse().find(e=>m-e[0]<=2);
    let x,y;
    if(last&&last[1]!=="a"){ x=last[2]===0?(last[1]==="g"?96:86):(last[1]==="g"?4:14); y=last[1]==="g"?50:35+((last[0]*13)%30); }
    else { x=50+(r.pos-50)*.5+28*Math.sin(m*.9+ci*1.3); y=50+32*Math.sin(m*1.7+ci*2.1); }
    if(m===0||L.pause) { x=50; y=50; }
    const stat=(label,a,b,pct)=>{ const tot=a+b||1, wa=pct?a:Math.round(a/tot*100); return `<div class="lstat"><span class="mono">${a}${pct?"%":""}</span><span class="lsl">${label}</span><span class="mono">${b}${pct?"%":""}</span><div class="lsb"><i style="width:${wa}%;background:${COLORS[f.h]}"></i><i style="width:${100-wa}%;background:${COLORS[f.a]}"></i></div></div>`; };
    const clock=L.ended?"Final":(m===45&&L.pause?"Descanso":m+"'");
    const feed=[...vis].reverse().slice(0,6).map(e=>`<li class="fe-${e[1]}"><span class="mono">${e[0]}'</span><span>${commentary(e)} <span class="note">· ${n(e[2]?f.a:f.h)}</span></span></li>`).join("")
      || `<li><span class="mono">0'</span><span>Rueda el balón.</span></li>`;
    return `<div class="livecard" id="live${k}">
      <div class="lhead"><span class="tn h" style="color:${COLORS[f.h]}">${n(f.h)}</span><span class="lscore mono" id="ls${k}">${gh} – ${ga}</span><span class="tn" style="color:${COLORS[f.a]}">${n(f.a)}</span></div>
      <div class="lclock"><span class="mono">${clock}</span><div class="lbar"><i style="width:${m/90*100}%"></i></div></div>
      <div class="pitch"><div class="ball" style="left:${x}%;top:${y}%"></div></div>
      <div class="lstats">${stat("Posesión",r.pos,100-r.pos,true)}${stat("Tiros",cnt("gfsp",0),cnt("gfsp",1))}${stat("A puerta",cnt("gs",0),cnt("gs",1))}${stat("Amarillas",cnt("a",0),cnt("a",1))}</div>
      <ol class="feed">${feed}</ol>
    </div>`;
  }).join("");
  return `<section class="box live">
    <div class="row" style="justify-content:space-between"><span class="label">Jornada ${L.j} · ${L.ended?"terminada":"en directo"}</span>
      <div class="row">${L.ended?`<button class="btn amber sm" id="lclose">Continuar</button>`
        :`<button class="btn ghost sm" id="lspeed">Velocidad x${L.speed}</button><button class="btn ghost sm" id="lskip">Ver resultado final</button>`}</div></div>
    <div class="livegrid">${cards}</div>
  </section>`;
}

function rollEvent(table, chance){
  if(Math.random()>=chance) return null;
  const keys=Object.keys(table).sort(()=>Math.random()-.5);
  for(const k of keys){ const r=table[k].apply(); if(r) return {k,...r}; }
  return null;
}

// ---------- Sonido (sintetizado, sin archivos) ----------
let AC=null, muted=false;
try{ muted=localStorage.getItem("subasta-mute")==="1"; }catch(e){}
function audio(){
  if(muted) return null;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==="suspended") AC.resume().catch(()=>{});
  return AC;
}
["pointerdown","keydown"].forEach(t=>document.addEventListener(t,()=>{ if(!muted) audio(); },{once:false,passive:true}));
function tone(f,d=.12,type="square",vol=.08,at=0,to=null){
  const a=audio(); if(!a) return; const t=a.currentTime+at;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d=.15,vol=.08,freq=1800,at=0){
  const a=audio(); if(!a) return; const t=a.currentTime+at;
  const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  f.type="bandpass"; f.frequency.value=freq; g.gain.value=vol; s.buffer=b;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  bid(){ tone(660,.07,"square",.06); tone(990,.09,"square",.05,.06); },
  clue(){ noise(.12,.12,2600); tone(1500,.05,"sine",.03,.03); },
  tick(hot){ tone(hot?1500:1000,.05,"square",hot?.07:.04); },
  sold(){ tone(110,.18,"sine",.25); noise(.06,.2,400); tone(880,.5,"triangle",.07,.12); tone(1320,.5,"triangle",.05,.16); },
  desert(){ tone(330,.35,"sawtooth",.04,0,160); },
  skip(){ noise(.25,.08,900); tone(500,.15,"sine",.03,0,250); },
  event(){ [523,659,784,1047].forEach((f,i)=>tone(f,.14,"square",.05,i*.09)); },
  troll(){ [392,370,349].forEach((f,i)=>tone(f,.32,"sawtooth",.05,i*.34)); tone(330,.8,"sawtooth",.05,1.02,300); },
  wait(){ tone(220,.12,"sine",.06); },
  go(){ tone(1200,.25,"square",.08); },
  whistle(){ tone(2900,.16,"sine",.07); tone(2700,.16,"sine",.07,.18); tone(2900,.45,"sine",.07,.38); },
  goal(at=0){ noise(.6,.15,1200,at); tone(784,.12,"square",.04,at); tone(1047,.2,"square",.04,at+.1); },
  champ(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.08,i*.16)); noise(1.2,.12,1400,.4); },
  err(){ tone(180,.12,"square",.05); },
  save(){ tone(140,.2,"sine",.22); noise(.12,.18,500); tone(520,.25,"triangle",.05,.08,260); },
};
function toggleMute(){
  muted=!muted; try{ localStorage.setItem("subasta-mute",muted?"1":"0"); }catch(e){}
  if(!muted) SFX.bid();
  const b=document.getElementById("mute"); if(b){ b.textContent=muted?"Sonido: no":"Sonido: sí"; b.setAttribute("aria-pressed",String(!muted)); }
}

// ---------- Feedback: compara lo que había con lo que hay y reacciona ----------
let seen={};
const reduceMotion = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
function flashEl(id,cls){ const el=document.getElementById(id); if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function react(){
  if(!S) return;
  if(S.phase==="auction"&&S.lot){
    const L=S.lot, M=L.mini, skips=L.skipped.filter(Boolean).length;
    if(seen.di!==S.di||seen.phase!=="auction"){
      if(L.ev){ (EVENTS[L.ev.k]&&EVENTS[L.ev.k].troll?SFX.troll:SFX.event)(); flashEl("evbanner","event-in"); }
      else SFX.clue();
      seen={phase:"auction",di:S.di,bid:L.bid,clues:L.clues,sold:!!L.sold,skips,mini:M&&M.phase,cd:L.cd};
      return;
    }
    if(L.bid!==seen.bid&&L.leader>=0){ SFX.bid(); flashEl("price","bump"); flashEl("team"+L.leader,"pulse"); }
    if(L.clues>seen.clues&&!L.sold) SFX.clue();
    if(skips>seen.skips) SFX.skip();
    if(L.sold&&!seen.sold){ if(L.sold.to>=0){ SFX.sold(); flashEl("stamp","stamp-in"); flashEl("team"+L.sold.to,"pulse"); } else SFX.desert(); }
    const mp=M&&M.phase, mh=M?M.hist.length:0;
    if(mp!==seen.mini&&mp==="kick") SFX.wait();
    if(M&&mp==="result"&&seen.mini!=="result"&&M.last){ flashEl("pball","anim"); flashEl("glove","anim"); if(M.last.goal){ SFX.goal(); flashEl("pgoal","goalflash"); } else { SFX.save(); flashEl("pgoal","shake-x"); } }
    if(!L.sold&&L.leader>=0&&L.cd!==seen.cd&&L.cd<=3&&L.cd>0) SFX.tick(L.cd<=2);
    seen={phase:"auction",di:S.di,bid:L.bid,clues:L.clues,sold:!!L.sold,skips,mini:mp,cd:L.cd};
  } else if(S.phase==="league"||S.phase==="final"){
    const played=S.played||0, po=!!(S.playoff&&S.playoff.res), nlev=(S.lev||[]).length;
    if(seen.phase==="league"){
      if(nlev>seen.nlev){ const e=S.lev[S.lev.length-1]; (LEVENTS[e.k]&&LEVENTS[e.k].troll?SFX.troll:SFX.event)(); }
      if(played>seen.played&&!S.live){
        SFX.whistle();
        const goals=S.fx.slice(seen.played,played).reduce((s,f)=>s+(f.res?f.res.gh+f.res.ga:0),0);
        for(let g=0;g<Math.min(goals,4);g++) SFX.goal(.9+g*.35);
        S.fx.slice(seen.played,played).forEach((f,k)=>flashEl("m"+(seen.played+k),"pulse"));
      }
      if(po&&!seen.po) SFX.whistle();
    }
    const LV=S.live;
    if(LV&&seen.liveJ!==LV.j+"-"+S.played){ SFX.whistle(); }
    if(LV){
      const g=LV.ms.reduce((s,k)=>s+((S.fx[k].res.tl||[]).filter(e=>e[1]==="g"&&e[0]<=LV.min).length),0);
      if(seen.liveJ===LV.j+"-"+S.played&&g>seen.liveG){ SFX.goal(); LV.ms.forEach(k=>flashEl("live"+k,"goalflash")); }
      if(seen.liveJ===LV.j+"-"+S.played&&LV.min>=45&&seen.liveMin<45) SFX.whistle();
      if(LV.ended&&!seen.liveEnd) SFX.whistle();
      seen.liveG=g; seen.liveMin=LV.min; seen.liveEnd=LV.ended; seen.liveJ=LV.j+"-"+S.played;
    } else { seen.liveJ=null; seen.liveEnd=false; }
    const champ=!!document.getElementById("champ");
    if(champ&&!seen.champ){ setTimeout(()=>{ SFX.champ(); confetti(); },seen.phase==="league"?900:0); }
    seen={...seen,phase:"league",played,po,nlev,champ};
  } else seen={phase:S.phase};
}
function confetti(){
  if(reduceMotion) return;
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const x=c.getContext("2d"); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=["#5cb3ff","#ff7096","#b996ff","#4fd6b8","#ffb627","#eef4ec"];
  const P=Array.from({length:160},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:4+Math.random()*6,r:Math.random()*6,c:pickR(cols)}));
  const t0=performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(t-t0<3500) requestAnimationFrame(f); else c.remove();
  })(t0);
}

function route(){
  if(!S) return renderSetup();
  netbar();
  if(S.phase==="lobby") return renderLobby();
  if(S.phase==="auction"){
    const M=S.lot.mini; if(M&&!S.lot.sold&&M.phase!=="ready"){ M.phase="ready"; }
    renderAuction(true); if(!S.lot.sold) run();
  }
  else { renderLeague(); runLive(); }
}
{ const b=document.getElementById("mute"); b.onclick=toggleMute; b.textContent=muted?"Sonido: no":"Sonido: sí"; b.setAttribute("aria-pressed",String(!muted)); }
renderSetup();
