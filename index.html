<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subasta Futbolera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Chivo+Mono:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: estadio de noche. Arriba las plantillas (de 2 a 4), en el centro el lote misterioso con sus pistas, abajo las paletas de puja. */
:root{
  --pitch:#0c2a21; --pitch-2:#113629; --panel:#173f31; --panel-2:#0a1f18; --chalk:#eef4ec; --muted:#a9c2b4;
  --line:rgba(238,244,236,.16); --amber:#ffb627; --ok:#45c985; --bad:#ff5d5d;
  --m1:#5cb3ff; --m2:#ff7096; --m3:#b996ff; --m4:#4fd6b8;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);font-size:16px;color:var(--chalk);background:var(--pitch);
  background-image:repeating-linear-gradient(90deg,var(--pitch) 0 80px,var(--pitch-2) 80px 160px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:.95}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{border:0;border-radius:6px;padding:12px 20px;font-weight:700;font-size:1rem;background:var(--chalk);color:var(--pitch);text-transform:uppercase;letter-spacing:.05em}
.btn:hover{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--chalk)}
.btn.amber{background:var(--amber);color:#2a1a00}
.btn.sm{padding:8px 12px;font-size:.85rem}
.btn:disabled{opacity:.35;cursor:not-allowed}
.label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{color:var(--muted);font-size:.85rem}

/* Portada */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.hero h1{font-size:clamp(3rem,10vw,6.5rem);font-weight:900}
.hero h1 span{color:var(--amber)}
.hero p{margin:0;color:var(--muted);max-width:62ch;line-height:1.5}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:var(--pitch);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:6px;color:var(--chalk);padding:11px 12px;font:inherit;font-size:1.05rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--pitch);color:var(--chalk);border-radius:6px;padding:8px 14px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.rules{margin:0;padding-left:18px;color:var(--muted);line-height:1.6;font-size:.95rem}
.rules b{color:var(--chalk)}
.formation{font-family:var(--f-mono);font-size:.85rem;color:var(--chalk)}

/* Plantillas */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.team{background:var(--panel-2);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.team.lead{box-shadow:0 0 0 2px var(--c)}
.team .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team .nm{font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-transform:uppercase;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.team .money{font-family:var(--f-mono);font-weight:700;font-size:1.2rem;color:var(--amber);white-space:nowrap}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{font-family:var(--f-mono);font-size:.75rem;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.slot.full{background:var(--chalk);color:var(--pitch);border-color:var(--chalk)}
.roster{display:flex;flex-direction:column;gap:2px;font-size:.85rem;max-height:9.5em;overflow:auto}
.roster div{display:grid;grid-template-columns:2.6em 1fr auto;gap:6px;align-items:baseline}
.roster .ps{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.roster .pr{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* Lote */
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.lot{background:var(--chalk);color:#0f2219;border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative}
.lot .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pos{font-family:var(--f-display);font-weight:900;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;background:#0f2219;color:var(--chalk);padding:4px 10px;border-radius:4px}
.lot .count{font-family:var(--f-mono);font-size:.8rem;color:#3c5a4b}
.lot h2{font-size:clamp(2rem,5vw,3rem);font-weight:900}
.siluwrap{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px;align-items:center}
.silu{width:100%;height:auto;max-height:300px;background:linear-gradient(#dfe8e2,#cfdcd4);border-radius:8px}
.silufacts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:1.02rem}
.silufacts b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.silufacts li.hidden{color:#7d958a;font-style:italic}
@media (max-width:480px){.siluwrap{grid-template-columns:1fr}.silu{max-width:200px;margin:0 auto}}
.career{display:flex;flex-wrap:wrap;gap:8px}
.club{position:relative;background:#0f2219;color:var(--chalk);border-radius:6px;padding:9px 12px;flex:1 1 130px;max-width:210px;display:flex;flex-direction:column;gap:4px;min-width:0}
.club .yrs{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.club .cn{font-family:var(--f-display);font-weight:800;font-size:1.2rem;text-transform:uppercase;line-height:1}
.club.loan{background:transparent;color:#0f2219;border:1.5px dashed #3c5a4b}
.club.loan .yrs{color:#3c5a4b}
.club .tag{position:absolute;top:6px;right:8px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#c2410c}
.club.hidden{background:transparent;border:1.5px dashed #b8c8bf;color:#7d958a}
.club.new{animation:in .45s both}
@media (prefers-reduced-motion:reduce){.club.new{animation:none}}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:k}
.clues li{counter-increment:k;display:grid;grid-template-columns:2.2em 1fr;gap:10px;font-size:1.08rem;line-height:1.4;font-weight:500}
.clues li::before{content:"0" counter(k);font-family:var(--f-mono);font-weight:700;color:#3c5a4b;padding-top:.15em}
.clues li.hidden{color:#7d958a;font-style:italic}
.clues li.new{animation:in .45s both}
@keyframes in{from{opacity:.0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.clues li.new{animation:none}}
.reveal{border-top:2px dashed #b8c8bf;padding-top:14px;display:flex;flex-direction:column;gap:6px}
.reveal .who{font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,6vw,3.6rem);text-transform:uppercase;line-height:.95}
.rating{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:700;background:#0f2219;color:var(--amber);border-radius:6px;padding:4px 10px;font-size:1.3rem}

.auction{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.price{font-family:var(--f-mono);font-weight:700;font-size:clamp(2.6rem,7vw,4rem);color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.leader{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;min-height:1.2em}
.call{font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;min-height:1.3em}
.call.hot{color:var(--bad)}
.cdbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.cdbar i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
@media (prefers-reduced-motion:reduce){.cdbar i{transition:none}}

.paddles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.paddle{border:1.5px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel);min-width:0}
.paddle .pn{font-family:var(--f-display);font-weight:800;font-size:1.2rem;text-transform:uppercase;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paddle .why{font-size:.8rem;color:var(--muted);min-height:1.2em}
.bids{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:380px){.bids{grid-template-columns:repeat(2,1fr)}}
.bid{border:0;border-radius:6px;padding:10px 4px;background:var(--c);color:#0b1612;font-weight:800;font-family:var(--f-mono);display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation}
.bid kbd{font-family:var(--f-mono);font-size:.68rem;font-weight:700;opacity:.7;border:1px solid rgba(0,0,0,.35);border-radius:3px;padding:0 4px}
.bid:disabled{opacity:.25;cursor:not-allowed}
.bid:active:not(:disabled){transform:translateY(1px)}
.flash{min-height:1.3em;color:var(--bad);font-weight:600}
.netbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--panel-2);border:1px solid var(--amber);border-radius:8px;padding:8px 12px;font-size:.9rem}
.namestep{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.namestep input{flex:1 1 200px;min-width:0;background:var(--pitch);border:1.5px solid var(--line);border-left:5px solid var(--amber);border-radius:6px;color:var(--chalk);padding:11px 12px;font:inherit;font-size:1.05rem}
.online-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
/* eventos y feedback */
.event{display:flex;flex-direction:column;gap:3px;background:#0f2219;color:var(--chalk);border-radius:8px;padding:12px 14px;border-left:5px solid var(--amber)}
.event b{font-family:var(--f-display);font-size:1.35rem;text-transform:uppercase;letter-spacing:.03em;color:var(--amber)}
.event .label{color:var(--muted)}
.event.troll{border-left-color:var(--m2)}
.event.gift{border-left-color:var(--muted)}
.event.gift b{color:var(--chalk)}
.event.troll b{color:var(--m2)}
.lot .event{margin-top:-4px}
.event-in{animation:evin .5s cubic-bezier(.2,1.4,.4,1) both}
.event-in.troll{animation:evin .5s cubic-bezier(.2,1.4,.4,1) both, shake .5s .5s both}
@keyframes evin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-1deg)}40%{transform:translateX(6px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18);color:var(--chalk)}100%{transform:scale(1)}}
.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c,var(--amber))}100%{box-shadow:0 0 0 14px transparent}}
.stamp{position:absolute;bottom:22px;right:18px;font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,4vw,2.4rem);text-transform:uppercase;color:#c2410c;border:4px solid #c2410c;border-radius:8px;padding:2px 12px;transform:rotate(-12deg);opacity:.9;pointer-events:none}
.stamp.desierto{color:#5b6b63;border-color:#5b6b63}
.stamp-in{animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(2.4)}to{opacity:.9;transform:rotate(-12deg) scale(1)}}
.flash-go{animation:flashgo .4s ease-out}
@keyframes flashgo{from{filter:brightness(1.8)}to{filter:none}}
.cdbar.hot i{background:var(--bad)}
.cdbar.clue i{background:var(--m1)}
.cdbar.idle i{background:var(--muted)}
.peek{display:inline-flex;gap:8px;align-items:center;font-weight:600;color:#3c5a4b}
.levlist{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.levlist .event{padding:8px 12px}
.levlist .event b{font-size:1.05rem}
.live{border-color:var(--amber)}
.livegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.livecard{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lhead{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.lhead .h{text-align:right}
.lscore{font-size:2rem;font-weight:700;background:#000;color:var(--amber);border-radius:6px;padding:2px 14px;min-width:4.2em;text-align:center}
.lclock{display:flex;gap:10px;align-items:center}
.lclock .mono{min-width:5.5em;color:var(--amber);font-weight:700}
.lbar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--amber);transition:width .2s linear}
.pitch{position:relative;aspect-ratio:105/68;width:100%;max-width:300px;margin:0 auto;border-radius:6px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#1f7a4a 0 10%,#1b6e43 10% 20%);border:2px solid rgba(255,255,255,.7)}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.7)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .ball{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:translate(-50%,-50%);transition:left .25s linear,top .25s linear;z-index:1}
.pitch{background-image:repeating-linear-gradient(90deg,#1f7a4a 0 10%,#1b6e43 10% 20%),linear-gradient(transparent,transparent)}
.lstats{display:flex;flex-direction:column;gap:6px}
.lstat{display:grid;grid-template-columns:3.2em 1fr 3.2em;gap:6px;align-items:center;font-size:.85rem}
.lstat .mono:last-of-type{text-align:right}
.lsl{text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.lsb{grid-column:1/-1;display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line)}
.lsb i{display:block;height:100%}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.88rem;min-height:9em}
.feed li{display:grid;grid-template-columns:2.6em 1fr;gap:6px}
.feed li .mono{color:var(--muted)}
.feed li.fe-g{color:var(--amber);font-weight:700}
.feed li.fe-a > span:last-child::before{content:"";display:inline-block;width:8px;height:11px;background:#ffd23f;border-radius:1px;margin-right:6px;vertical-align:-1px}
.goalflash{animation:goalflash 1s ease-out}
@keyframes goalflash{0%{box-shadow:0 0 0 0 var(--amber);background:#3a3110}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion:reduce){.goalflash{animation:none}.pitch .ball{transition:none}}
.mute{position:fixed;z-index:20;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(12px + env(safe-area-inset-right,0px));background:var(--panel-2);color:var(--chalk);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85rem}
.mute:hover{border-color:var(--chalk)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.event-in,.event-in.troll,.bump,.pulse,.stamp-in,.flash-go{animation:none}}
.slot.skips{border-color:var(--amber);color:var(--amber)}
.skipbtn{border:1.5px dashed var(--line);background:transparent;color:var(--chalk);border-radius:6px;padding:8px;font-weight:600;font-size:.85rem;display:flex;justify-content:center;gap:8px;align-items:center;touch-action:manipulation}
.skipbtn:hover:not(:disabled){border-color:var(--chalk)}
.skipbtn:disabled{opacity:.3;cursor:not-allowed}
.skipbtn kbd{font-family:var(--f-mono);font-size:.68rem;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.minibox{display:flex;flex-direction:column;gap:12px;line-height:1.45}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.duel .role{background:var(--panel);border:2px solid var(--c);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;min-width:0}
.duel .role b{font-family:var(--f-display);font-weight:900;font-size:clamp(1.3rem,3.2vw,1.9rem);text-transform:uppercase;color:var(--c);overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.duel .role .label{color:var(--chalk);letter-spacing:.2em}
.duel .you{font-size:.7rem;font-weight:700;background:var(--c);color:#0b1612;border-radius:3px;padding:0 6px;text-transform:uppercase}
.vsx{font-family:var(--f-display);font-weight:900;font-size:1.3rem;color:var(--muted);text-transform:uppercase}
.pscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pside{display:flex;flex-direction:column;gap:4px;min-width:0}
.pside.r{align-items:flex-end;text-align:right}
.pnum{font-size:1.8rem;font-weight:700;color:var(--amber)}
.pdots{display:flex;gap:4px}
.pdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.pdot.in{background:var(--ok);border-color:var(--ok)}
.pdot.out{background:var(--bad);border-color:var(--bad)}
.pgoal{display:grid;grid-template-columns:repeat(3,1fr);height:84px;border:5px solid var(--chalk);border-bottom:none;border-radius:4px 4px 0 0;background:repeating-linear-gradient(45deg,rgba(238,244,236,.1) 0 2px,transparent 2px 10px)}
.pgoal .zone{position:relative;border-right:1px dashed rgba(238,244,236,.25)}
.pgoal .zone:last-child{border-right:none}
.pball{position:absolute;left:50%;top:45%;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0b1612;transform:translate(-50%,-50%)}
.pball.anim{animation:shot .45s ease-out both}
.glove{position:absolute;left:50%;top:50%;width:46px;height:30px;border-radius:14px;background:var(--amber);opacity:.85;transform:translate(-50%,-50%)}
.glove.anim{animation:dive .4s ease-out both}
.glove.saved{background:var(--ok)}
@keyframes shot{from{top:140%;transform:translate(-50%,-50%) scale(.5)}to{top:45%}}
@keyframes dive{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:.85}}
.pgoal.is-goal{border-color:var(--ok)}
.pgoal.is-save{border-color:var(--bad)}
.presult{font-family:var(--f-display);font-weight:900;text-transform:uppercase;text-align:center;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1}
.presult.goal{color:var(--ok)} .presult.save{color:var(--bad)}
.pstatus{display:flex;flex-direction:column;gap:2px;font-size:.88rem;color:var(--muted)}
.pst.ok{color:var(--ok)}
.pctrl{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--c);border-radius:8px;padding:10px}
.pctrl .label{color:var(--c)}
.pbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pbtns .bid{font-family:var(--f-body);font-size:.95rem}
.shake-x{animation:shake .45s}
@media (prefers-reduced-motion:reduce){.pball,.glove,.shake-x{animation:none}}
.mini-light{font-family:var(--f-display);font-weight:900;text-transform:uppercase;text-align:center;font-size:clamp(2.6rem,8vw,4.5rem);border-radius:10px;padding:24px 10px;line-height:1}
.mini-light.wait{background:var(--bad);color:#2a0606}
.mini-light.go{background:var(--ok);color:#06210f}
.bid.mini{font-family:var(--f-display);font-size:1.15rem;text-transform:uppercase;padding:16px 6px}

/* Liga */
.league{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
td:nth-child(2),th:nth-child(2){text-align:left}
td.tm{font-family:var(--f-display);font-weight:800;font-size:1.2rem;text-transform:uppercase}
td.pts{font-family:var(--f-mono);font-weight:700;color:var(--amber);font-size:1.1rem}
.tablewrap{overflow-x:auto}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.match .h{text-align:right}
.match .tn{font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-transform:uppercase}
.match .sc{font-family:var(--f-mono);font-weight:700;font-size:1.4rem;background:var(--panel-2);border-radius:6px;padding:4px 12px;min-width:4.5em;text-align:center}
.match .gl{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.82rem;color:var(--muted)}
.match .gl div:first-child{text-align:right}
.jor{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:10px}
.champ{text-align:center;padding:24px;border-radius:10px;background:var(--panel-2);border:2px solid var(--c);display:flex;flex-direction:column;gap:8px;align-items:center}
.champ h1{font-size:clamp(2.6rem,9vw,5.5rem);font-weight:900;color:var(--c)}
.xi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.xi .team .roster{max-height:none}
.strength{display:flex;gap:10px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.strength b{color:var(--chalk)}

@media (max-width:820px){
  .stage,.league{grid-template-columns:1fr}
  .teams,.paddles,.xi{grid-template-columns:1fr}
  .roster{max-height:none}
}
</style>
</head>

<script>
// ---------- Plantilla y reglas ----------
const SLOTS = {POR:1, DEF:4, MED:3, DEL:3, DT:1};
const POS_NAME = {POR:"Portero", DEF:"Defensa", MED:"Centrocampista", DEL:"Delantero", DT:"Entrenador"};
const SQUAD = 12, BUDGET = 1000, MINP_SLOT = 10, CD = 8, CLUE_T = 6, IDLE_LIMIT = 12;
const COLORS = ["var(--m1)","var(--m2)","var(--m3)","var(--m4)"];
const MAXP = 4, MINP = 2;
const idx = () => S.m.map((_,i)=>i);
const KEYS = [["q","w","e","r"],["z","x","c","v"],["y","u","i","o"],["1","2","3","4"]];
const INCS = [10,20,50,100];

// ---------- Jugadores: r = media oculta, p = pistas de más difícil a más fácil ----------
const POOL = [
 // PORTEROS
 {n:"Gianluigi Buffon",pos:"POR",r:93,p:["En las categorías inferiores empezó jugando de centrocampista.","Bajó de categoría con su club por un escándalo y decidió quedarse.","Fue el portero más caro de la historia durante 17 años.","Se retiró con 45 años en el club donde debutó."]},
 {n:"Iker Casillas",pos:"POR",r:91,p:["Lo sacaron de clase en el instituto para viajar con el primer equipo.","Ganó una final europea entrando desde el banquillo por lesión del titular.","Terminó su carrera en el país vecino tras un problema de corazón.","Levantó como capitán un Mundial y dos Eurocopas."]},
 {n:"Manuel Neuer",pos:"POR",r:90,p:["Su fichaje provocó pancartas de protesta de su nueva afición por venir de un rival.","Quedó tercero en un Balón de Oro, algo rarísimo en su puesto.","Le operaron de un cáncer de piel en la cara.","Se le asocia con el término 'portero líbero'."]},
 {n:"Oliver Kahn",pos:"POR",r:88,p:["Paró tres penaltis en una tanda de una final de Champions.","Fue elegido mejor jugador de un Mundial cuya final perdió.","Un rechace suyo provocó el primer gol de esa final.","Su apodo era 'El Titán'."]},
 {n:"Petr Čech",pos:"POR",r:87,p:["Jugó más de una década con un casco protector tras una fractura de cráneo.","Ganó una Champions en el estadio del equipo rival.","Tras retirarse jugó al hockey sobre hielo, también de portero.","Es el portero con más porterías a cero de la historia de la Premier."]},
 {n:"Emiliano Martínez",pos:"POR",r:86,p:["Pasó casi diez años en un club grande encadenando cesiones.","Debutó con su selección pasados los 28 años.","Una parada suya en el minuto 123 cambió la historia de su país.","Celebró de forma polémica el premio al mejor portero de un Mundial."]},
 {n:"Kepa Arrizabalaga",pos:"POR",r:76,p:["Se formó en el Athletic y estuvo cedido en la Ponferradina y el Valladolid.","Es el portero más caro de la historia.","Se negó a ser sustituido en una final de copa en Wembley.","Fue cedido al Real Madrid tras la lesión de Courtois."]},
 {n:"André Onana",pos:"POR",r:75,p:["Fue sancionado nueve meses por tomar sin querer un medicamento de su mujer.","Abandonó un Mundial a mitad de torneo tras discutir con su seleccionador.","Llegó a una final de Champions con un club italiano.","Un gigante inglés pagó por él cerca de 50 millones."]},
 {n:"Loris Karius",pos:"POR",r:64,p:["Se formó en la cantera del Manchester City.","Cometió dos errores clamorosos en una final de Champions en Kiev.","Después se supo que había jugado esa final con una conmoción.","Años más tarde jugó una final de Copa de la Liga con el Newcastle."]},
 {n:"Keylor Navas",pos:"POR",r:85,p:["Llegó a Europa por un club de Segunda División española.","Su traspaso se cayó porque un fax llegó tarde.","Ganó tres Champions seguidas como titular.","Para muchos es el mejor futbolista de la historia de su país centroamericano."]},
 // DEFENSAS
 {n:"Paolo Maldini",pos:"DEF",r:93,p:["Jugó cuatro Mundiales y no ganó ninguno.","Marcó el gol más rápido de una final de Champions durante años y aun así la perdió.","Su padre fue capitán del mismo club.","Su hijo también debutó con esa camiseta."]},
 {n:"Franz Beckenbauer",pos:"DEF",r:95,p:["Jugó una semifinal de Mundial con el hombro dislocado y el brazo vendado al cuerpo.","Terminó su carrera en Estados Unidos junto a una leyenda brasileña.","Ganó el Mundial como jugador y como seleccionador.","Su apodo era un título imperial."]},
 {n:"Cafu",pos:"DEF",r:89,p:["Fue rechazado en varias pruebas de cantera antes de triunfar.","Ganó una Champions con 36 años en Italia.","Es el único jugador que ha disputado tres finales de Mundial seguidas.","Levantó la Copa del Mundo dedicándosela a su barrio, Jardim Irene."]},
 {n:"Sergio Ramos",pos:"DEF",r:90,p:["Tiene el récord de expulsiones en su liga.","Su selección lo usó años como lateral derecho siendo central.","Marcó en dos finales de Champions distintas.","Volvió casi veinte años después al club de su tierra antes de irse a México."]},
 {n:"Carles Puyol",pos:"DEF",r:88,p:["De niño jugaba de portero en su pueblo.","Cedió el brazalete para levantar un trofeo a un compañero que volvía de una enfermedad.","Marcó de cabeza el gol que llevó a su país a su primera final de Mundial.","Jugó toda su carrera en un solo club."]},
 {n:"Virgil van Dijk",pos:"DEF",r:89,p:["Trabajó lavando platos en un restaurante de joven.","Pasó por Escocia antes de triunfar en Inglaterra.","Fue el defensa más caro de la historia cuando cambió de club en 2018.","Quedó segundo en un Balón de Oro por detrás de Messi."]},
 {n:"Roberto Carlos",pos:"DEF",r:88,p:["Pasó por Italia sin triunfar antes de llegar a España.","Su gol de falta en un torneo en Francia parecía desafiar la física.","Fue segundo en el Balón de Oro de 2002.","Después de su etapa más gloriosa jugó en Turquía y en Rusia."]},
 {n:"Fabio Cannavaro",pos:"DEF",r:88,p:["Medía alrededor de 1,75, bajo para su puesto.","Su hermano también fue defensa en la Serie A.","Siguió a su entrenador a España tras un escándalo en su liga.","Es el último defensa que ha ganado el Balón de Oro."]},
 {n:"Philipp Lahm",pos:"DEF",r:88,p:["Fue cedido dos temporadas antes de asentarse en el club de su ciudad.","Jugó a máximo nivel de lateral derecho, lateral izquierdo y pivote.","Se retiró con 33 años, en forma y con contrato.","Fue capitán de su selección campeona del mundo."]},
 {n:"Javier Zanetti",pos:"DEF",r:87,p:["De joven trabajó de albañil con su padre.","Lo dejaron fuera de dos Mundiales estando en su mejor momento.","Ganó un triplete como capitán con 36 años.","Es el jugador con más partidos en la historia de su club italiano."]},
 {n:"Dani Alves",pos:"DEF",r:87,p:["Llegó a Europa con 19 años a un club andaluz.","Respondió a un insulto racista comiéndose un plátano lanzado al campo.","Ganó la medalla de oro olímpica con 38 años.","Es uno de los futbolistas con más títulos de la historia."]},
 {n:"Thiago Silva",pos:"DEF",r:87,p:["Estuvo meses ingresado por tuberculosis cuando jugaba en Rusia.","Fue capitán de su selección en un Mundial en casa.","Jugó en la Premier League con 39 años.","Volvió al club de Río donde se formó."]},
 {n:"Marcelo",pos:"DEF",r:86,p:["Llegó a Europa en pleno invierno con 18 años.","Terminó jugando en Grecia antes de volver a su país.","Se convirtió en el jugador con más títulos de la historia de su club.","Marcó en una final de Champions disputada en Lisboa."]},
 {n:"Rio Ferdinand",pos:"DEF",r:86,p:["Fue dos veces el defensa más caro del mundo.","Se perdió una Eurocopa por no presentarse a un control antidopaje.","Su hermano también jugó de central en la Premier.","Ganó la Champions en una final bajo la lluvia de Moscú."]},
 {n:"Giorgio Chiellini",pos:"DEF",r:86,p:["Es licenciado en Economía.","Empezó como lateral izquierdo.","Sufrió un mordisco en un Mundial.","Se hizo viral por tirar de la camiseta de un rival en una final continental."]},
 {n:"Achraf Hakimi",pos:"DEF",r:86,p:["Pasó por cuatro ligas distintas antes de cumplir 23 años.","Fue cedido a Alemania, donde batió récords de velocidad.","Nació en España pero eligió el país de sus padres.","Eliminó a España de un Mundial con un penalti a lo Panenka."]},
 {n:"Pepe",pos:"DEF",r:85,p:["Nació en Brasil pero jugó con otra selección.","Le cayeron diez partidos de sanción por agredir a un rival en el suelo.","Jugó la Champions con 41 años.","Ganó una Eurocopa siendo el mejor del partido en la final."]},
 {n:"Jordi Alba",pos:"DEF",r:85,p:["Su cantera lo dejó marchar por bajito y volvió años después por unos 14 millones.","En Valencia empezó jugando de extremo.","Marcó en una final de Eurocopa.","Terminó en Estados Unidos reuniéndose con antiguos compañeros."]},
 {n:"Phil Jones",pos:"DEF",r:71,p:["Llegó a un gigante inglés con 19 años desde el Blackburn.","Su entrenador dijo que podía acabar siendo el mejor jugador de la historia del club.","Sus caras de esfuerzo en el campo se convirtieron en memes.","Pasó más de dos años seguidos sin jugar por lesiones."]},
 {n:"Harry Maguire",pos:"DEF",r:77,p:["Marcó de cabeza en unos cuartos de final de Mundial.","Fue el defensa más caro de la historia cuando fichó en 2019.","Lo detuvieron estando de vacaciones en una isla griega.","Fue capitán de un gigante inglés hasta que le quitaron el brazalete."]},
 {n:"Yerry Mina",pos:"DEF",r:72,p:["Llegó a Barcelona a mitad de temporada desde un club brasileño.","Apenas jugó y se marchó al Everton tras unos meses.","Marcó tres goles de cabeza en un Mundial siendo central.","Celebra los goles bailando."]},
 {n:"Shkodran Mustafi",pos:"DEF",r:70,p:["De joven se fue a Inglaterra a la cantera del Everton.","Fue campeón del mundo en 2014.","Pasó por Valencia antes de que un club de Londres pagara unos 40 millones por él.","Sus despistes se volvieron meme entre su propia afición."]},
 // CENTROCAMPISTAS
 {n:"Zinedine Zidane",pos:"MED",r:95,p:["Hijo de inmigrantes argelinos, creció en un barrio de Marsella.","Marcó dos goles de cabeza en una final de Mundial.","Su carrera terminó con una expulsión en otra final.","Marcó de volea en una final de Champions en Glasgow."]},
 {n:"Andrés Iniesta",pos:"MED",r:91,p:["Su familia tiene viñedos en un pueblo muy pequeño.","Lloraba en la residencia de la cantera porque echaba de menos a su familia.","Dedicó su gol más famoso a un amigo fallecido.","Jugó cinco temporadas en Japón."]},
 {n:"Xavi Hernández",pos:"MED",r:91,p:["Quedó tercero en tres Balones de Oro seguidos.","Fue el mejor jugador de la Eurocopa de 2008.","Fue el jugador con más partidos de su club hasta que lo superó un compañero.","Se retiró en Catar y allí empezó a entrenar."]},
 {n:"Luka Modrić",pos:"MED",r:90,p:["Creció como refugiado de guerra en un hotel.","De joven fue cedido a la liga bosnia.","Un diario lo eligió en una encuesta como peor fichaje de su primera temporada en España.","Rompió una década de dominio de dos superestrellas en un premio individual."]},
 {n:"Andrea Pirlo",pos:"MED",r:90,p:["Empezó de mediapunta y lo retrasaron a la base de la jugada.","Su club lo dejó ir gratis y ganó cuatro ligas seguidas con el rival.","Tiró un penalti a lo Panenka a Inglaterra en una Eurocopa.","Su autobiografía se titula 'Pienso, luego juego'."]},
 {n:"Kevin De Bruyne",pos:"MED",r:90,p:["Un club de Londres lo vendió tras darle muy pocos minutos.","Fue su propio negociador en una renovación, ayudado por analistas de datos.","Se reveló en Alemania antes de volver a Inglaterra.","Ya veterano, se fue a jugar a Nápoles."]},
 {n:"Pavel Nedvěd",pos:"MED",r:89,p:["Llegó a Italia tras una gran Eurocopa en Inglaterra.","Se perdió una final de Champions por una amarilla en semifinales.","Se quedó con su club tras un descenso administrativo.","Lo apodaban 'La Furia Checa'."]},
 {n:"Steven Gerrard",pos:"MED",r:88,p:["Un primo suyo murió en la tragedia de Hillsborough.","Remontó un 3-0 en una final de Champions.","Un resbalón suyo costó una liga.","Terminó su carrera en Los Ángeles."]},
 {n:"Clarence Seedorf",pos:"MED",r:87,p:["Debutó con 16 años en su club formativo.","Ganó la Champions con tres clubes distintos.","Se retiró en Brasil.","Entrenó al club donde más triunfó justo después de retirarse."]},
 {n:"Bastian Schweinsteiger",pos:"MED",r:87,p:["De joven estuvo a punto de dedicarse al esquí.","Falló un penalti en una final de Champions jugada en su estadio.","Jugó una final de Mundial con la cara ensangrentada.","Se casó con una ex número uno del tenis."]},
 {n:"Sergio Busquets",pos:"MED",r:87,p:["Su padre fue portero del mismo club.","Debutó con el primer equipo de la mano de su entrenador del filial.","Marcó menos de 20 goles en más de 700 partidos con su club.","Terminó en Miami junto a viejos compañeros."]},
 {n:"N'Golo Kanté",pos:"MED",r:87,p:["Con más de 20 años todavía jugaba en divisiones menores de su país.","Ganó una liga con un equipo al que las casas de apuestas daban 5000 a 1.","Al año siguiente volvió a ser campeón con otro club.","Fue campeón del mundo y luego se marchó a Arabia Saudí."]},
 {n:"Juan Román Riquelme",pos:"MED",r:87,p:["En Barcelona su entrenador apenas contó con él.","Llevó a un equipo pequeño a semifinales de Champions.","Falló un penalti en el último minuto de esa semifinal.","Años después fue elegido presidente del club de su vida."]},
 {n:"Frank Lampard",pos:"MED",r:86,p:["Su padre y su tío fueron figuras del club donde empezó.","Le anularon en un Mundial un gol que entró claramente.","Es el máximo goleador histórico de su club siendo centrocampista.","Terminó su carrera en Nueva York."]},
 {n:"Gennaro Gattuso",pos:"MED",r:82,p:["Con 19 años se fue a jugar a Escocia.","Se encaró con el ayudante del entrenador rival en un partido de Champions.","Al final de su carrera jugó en Suiza.","Lo apodaban 'Rino'."]},
 {n:"Philippe Coutinho",pos:"MED",r:78,p:["Llegó a Europa por un club de Milán siendo un adolescente.","Fue uno de los tres fichajes más caros de la historia.","Estando cedido, ganó la Champions marcando dos goles al club que lo había fichado.","Acabó en Catar y luego volvió al club brasileño donde se formó."]},
 {n:"Arda Turan",pos:"MED",r:74,p:["Le tiró una bota a un juez de línea.","Fue ídolo en el Atlético de Madrid.","Fichó por el Barça cuando estaba sancionado y no pudo jugar en seis meses.","Fue condenado en su país por un incidente con un arma."]},
 {n:"Kevin-Prince Boateng",pos:"MED",r:73,p:["Su hermano jugó con otra selección distinta a la suya.","Abandonó un amistoso por los insultos racistas de la grada.","Llegó cedido al Barça desde el Sassuolo en el mercado de invierno.","No marcó ningún gol con esa camiseta."]},
 {n:"Arthur Melo",pos:"MED",r:72,p:["Al llegar a Europa lo comparaban con Xavi.","Salió del Barça en un intercambio con Pjanić muy criticado.","Estuvo cedido en el Liverpool y jugó 13 minutos en toda la temporada.","Venía del Grêmio."]},
 {n:"Donny van de Beek",pos:"MED",r:70,p:["Marcó el gol de la ida de unas semifinales de Champions en Londres.","Un gigante inglés pagó unos 40 millones y casi no lo puso.","Fue cedido al Everton y al Eintracht.","Acabó fichando por el Girona."]},
 // DELANTEROS
 {n:"Ronaldo Nazário",pos:"DEL",r:94,p:["Fue campeón del mundo sin jugar un solo minuto.","Sufrió una convulsión horas antes de una final de Mundial.","Se rompió el tendón rotuliano dos veces.","Marcó un golazo tras una carrera desde el medio campo en Compostela."]},
 {n:"Ronaldinho",pos:"DEL",r:92,p:["Con 13 años marcó más de 20 goles en un solo partido.","Le marcó de falta, desde muy lejos, a un portero inglés en un Mundial.","Un estadio rival le aplaudió de pie.","Pasó meses detenido en Paraguay por un pasaporte falso."]},
 {n:"Thierry Henry",pos:"DEL",r:91,p:["Empezó de extremo y su entrenador en Londres lo convirtió en delantero.","Una mano suya clasificó a su país para un Mundial.","Tiene una estatua frente al estadio de su club.","Volvió cedido a su antiguo club inglés y marcó en su regreso."]},
 {n:"Romário",pos:"DEL",r:90,p:["Hizo un hat-trick en un 5-0 a su gran rival en España.","Fue elegido mejor jugador del Mundial que ganó.","Asegura haber superado los 1000 goles.","Hoy es senador en su país."]},
 {n:"Robert Lewandowski",pos:"DEL",r:90,p:["Un club de su capital lo descartó de joven por ser demasiado delgado.","Marcó cinco goles en nueve minutos saliendo desde el banquillo.","Se quedó sin Balón de Oro el año que se suspendió por la pandemia.","Su mujer fue medallista mundial de kárate."]},
 {n:"Erling Haaland",pos:"DEL",r:90,p:["Nació en Inglaterra porque su padre jugaba allí.","Marcó nueve goles en un partido de un Mundial sub-20.","Jugó en Austria antes de dar el salto.","Batió el récord de goles en una temporada de Premier en su primer año."]},
 {n:"Didier Drogba",pos:"DEL",r:89,p:["Debutó como profesional tarde, en la segunda división francesa.","Pidió un alto el fuego en su país tras clasificarlo para un Mundial.","Jugó en China y en Canadá.","Marcó el penalti decisivo de una final de Champions en Múnich."]},
 {n:"Samuel Eto'o",pos:"DEL",r:89,p:["Su club formativo lo cedió tres veces y nunca le dio la oportunidad.","Fue el futbolista mejor pagado del mundo jugando en Rusia.","Ganó dos tripletes seguidos con clubes distintos.","Hoy preside la federación de fútbol de su país."]},
 {n:"Zlatan Ibrahimović",pos:"DEL",r:89,p:["De joven practicó taekwondo.","Llamaba 'el filósofo' a un entrenador con el que chocó en España.","Marcó cuatro goles a Inglaterra en un amistoso, uno de chilena desde 30 metros.","Ganó la liga en cuatro países distintos."]},
 {n:"Raúl González",pos:"DEL",r:89,p:["Se formó en el gran rival de su ciudad hasta que cerraron la cantera.","Debutó en Primera con 17 años.","Mandó callar a un estadio rival tras marcar.","Terminó jugando en Catar y Nueva York."]},
 {n:"Gabriel Batistuta",pos:"DEL",r:89,p:["De joven prefería el baloncesto.","Se quedó con su club tras un descenso a la Serie B.","Los aficionados le hicieron una estatua mientras seguía jugando.","Lloró tras marcar a su exequipo el año que ganó la liga en la capital."]},
 {n:"Luis Suárez",pos:"DEL",r:89,p:["Se mudó a otro país siguiendo a su novia.","Paró con la mano un gol en el último minuto de unos cuartos de un Mundial.","Fue sancionado por morder a rivales en tres ocasiones.","Ganó una liga tras ser apartado por su club anterior."]},
 {n:"Antoine Griezmann",pos:"DEL",r:88,p:["Fue rechazado por varias canteras de su país por ser bajito.","Lo fichó un club vasco tras verlo en una prueba.","Fue máximo goleador de una Eurocopa que su país perdió en casa.","Celebra los goles con un baile de un videojuego."]},
 {n:"Fernando Torres",pos:"DEL",r:85,p:["Marcó en dos finales de Eurocopa.","Fue el fichaje más caro de la historia del fútbol británico en 2011.","Volvió cedido y luego en propiedad a su club de la infancia.","Se retiró en Japón."]},
 {n:"Diego Forlán",pos:"DEL",r:85,p:["De joven jugaba al tenis a buen nivel.","Su padre fue mundialista y su abuelo seleccionador.","Ganó la Bota de Oro con dos clubes distintos de la misma liga.","Fue Balón de Oro de un Mundial en el que su país quedó cuarto."]},
 {n:"Jamie Vardy",pos:"DEL",r:83,p:["Trabajaba en una fábrica de férulas mientras jugaba en el fútbol amateur.","Tuvo que jugar un tiempo con una pulsera de control judicial.","Marcó en 11 jornadas de liga seguidas.","Ganó una liga contra todo pronóstico."]},
 {n:"Bojan Krkić",pos:"DEL",r:74,p:["Batió récords de precocidad de Messi en su club.","La ansiedad le hizo renunciar a ir a una Eurocopa con 17 años.","Pasó por Roma, Milan, Ajax y Stoke.","Terminó su carrera en Japón."]},
 {n:"Eden Hazard",pos:"DEL",r:79,p:["Costó más de 100 millones a un gigante español.","Llegó a su primera pretemporada con kilos de más.","Marcó solo cuatro goles de liga en cuatro temporadas.","Se retiró con 32 años tras brillar siete años en Londres."]},
 {n:"João Félix",pos:"DEL",r:77,p:["Ganó el premio Golden Boy.","Fue el tercer fichaje más caro de la historia.","Fue cedido al Chelsea y al Barça.","Acabó en Arabia Saudí junto a Cristiano."]},
 {n:"Mario Balotelli",pos:"DEL",r:77,p:["Le prendió fuego a su propia casa con unos petardos.","Enseñó una camiseta que preguntaba '¿Por qué siempre yo?'.","No consiguió ponerse un peto de entrenamiento delante de las cámaras.","Le marcó dos goles a Alemania en una semifinal de Eurocopa."]},
 {n:"Antony",pos:"DEL",r:75,p:["Un gigante inglés pagó casi 100 millones por él.","Se hizo famoso por girar sobre sí mismo con el balón sin motivo.","Venía del Ajax.","Revivió cedido en el Betis."]},
 {n:"Luuk de Jong",pos:"DEL",r:74,p:["Su hermano también fue internacional.","Fue máximo goleador de la Eredivisie con el PSV.","Marcó dos goles en una final de Europa League con el Sevilla.","Llegó cedido al Barça el último día del mercado."]},
 {n:"Ansu Fati",pos:"DEL",r:72,p:["Nació en Guinea-Bisáu.","Heredó el dorsal 10 de Messi.","Las lesiones de rodilla frenaron una carrera que empezó con récords de precocidad.","Fue cedido al Brighton y al Mónaco."]},
 {n:"Luka Jović",pos:"DEL",r:72,p:["Brilló en el Eintracht Fráncfort.","Costó unos 60 millones a un gigante español.","Lo sancionaron por saltarse la cuarentena durante la pandemia.","Acabó en el Milan."]},
 {n:"Andy Carroll",pos:"DEL",r:70,p:["Fue el fichaje inglés más caro de la historia en 2011.","Llegó a su nuevo club el mismo día que Luis Suárez.","Era famoso por su coleta y su juego de cabeza.","Pasó luego muchos años en el West Ham."]},
 {n:"Martin Braithwaite",pos:"DEL",r:70,p:["Pasó por el Toulouse y el Middlesbrough.","Venía del Leganés.","Lo fichó un gigante español fuera de mercado por la lesión de otro delantero.","Muchos aficionados no sabían quién era el día que llegó."]},
 // ENTRENADORES
 {n:"Alex Ferguson",pos:"DT",r:94,p:["De joven trabajó en los astilleros de su ciudad.","Ganó una Recopa con un club escocés ante el Real Madrid.","Una bota que lanzó en el vestuario le abrió la ceja a su estrella.","Dirigió más de 26 años al mismo club."]},
 {n:"Pep Guardiola",pos:"DT",r:95,p:["Como jugador acabó su carrera en Catar y en México.","Empezó entrenando al filial en Tercera División.","Se tomó un año sabático en Nueva York.","Ganó dos tripletes con clubes distintos."]},
 {n:"Carlo Ancelotti",pos:"DT",r:93,p:["Fue centrocampista de un equipo legendario de finales de los 80.","Ha ganado la liga en las cinco grandes ligas de Europa.","Dirige a una selección sudamericana.","Es el entrenador con más Champions de la historia."]},
 {n:"José Mourinho",pos:"DT",r:91,p:["Empezó como traductor de un entrenador inglés.","Ganó una Champions con un club portugués.","Se presentó en Londres llamándose a sí mismo 'especial'.","Ganó un triplete con un club italiano."]},
 {n:"Jürgen Klopp",pos:"DT",r:90,p:["Como jugador fue casi siempre defensa en la segunda división de su país.","Se presentó en Inglaterra como 'el normal'.","Ganó una liga que su club no ganaba desde hacía 30 años.","Hoy trabaja para una marca de bebidas energéticas."]},
 {n:"Luis Enrique",pos:"DT",r:89,p:["Jugó en los dos grandes rivales de su liga.","Le rompieron la nariz de un codazo en un Mundial.","Corre maratones y ha completado un Ironman.","Ganó un triplete con un club francés."]},
 {n:"Diego Simeone",pos:"DT",r:88,p:["Como jugador ganó la liga con el club que luego entrenó.","Provocó la expulsión de una estrella inglesa en un Mundial.","Llegó al banquillo a mitad de temporada en diciembre de 2011.","Lleva más de una década en el mismo banquillo."]},
 {n:"Vicente del Bosque",pos:"DT",r:87,p:["Fue centrocampista casi toda su carrera en un solo club grande.","Su club no le renovó justo después de ganar la liga.","Fue nombrado marqués.","Ganó un Mundial y una Eurocopa con su selección."]},
 {n:"Julen Lopetegui",pos:"DT",r:79,p:["Como portero fue suplente en los dos grandes de España.","Lo destituyeron de su selección a dos días de un Mundial.","Duró unos cuatro meses en su nuevo club y lo echaron tras un 5-1 en el Clásico.","Se resarció ganando una Europa League en Sevilla."]},
 {n:"Roberto Di Matteo",pos:"DT",r:77,p:["Como jugador marcó a los 42 segundos en una final de FA Cup.","Llegó al banquillo como interino a mitad de temporada.","Ganó la Champions ese mismo año.","Lo despidieron seis meses después."]},
 {n:"Ole Gunnar Solskjær",pos:"DT",r:74,p:["Como jugador lo llamaban 'el asesino con cara de niño'.","Marcó cuatro goles en doce minutos saliendo desde el banquillo.","Entrenó al Molde y al Cardiff.","Volvió a su exclub como interino en diciembre de 2018."]},
 {n:"Santiago Solari",pos:"DT",r:70,p:["Como jugador ganó una Champions con el Madrid.","Subió desde el filial tras el despido de su predecesor.","Ganó un Mundial de Clubes como entrenador del primer equipo.","Después entrenó al América de México."]},
 {n:"Marcelo Bielsa",pos:"DT",r:85,p:["Su apodo está relacionado con la locura.","Llevó a un club vasco a dos finales en la misma temporada.","Admitió haber mandado espiar un entrenamiento rival en Inglaterra.","Dirige a una selección sudamericana que no es la suya."]},

// Conexión directa entre navegadores (PeerJS). El anfitrión es el centro: los demás se conectan a él.
const PEER_PREFIX = "subasta-futbolera-";
function peerRoom(code){
  return new Promise((resolve,reject)=>{
    const isHost = NET.role==="host";
    const handlers = {}, peerFns = [];
    const conns = new Map();               // anfitrión: id del invitado -> conexión
    let hostConn = null, me = null, done = false;
    const peer = isHost ? new Peer(PEER_PREFIX+code.toLowerCase()) : new Peer();
    const list = () => [{peer:me,sameTab:true}, ...(isHost ? [...conns.keys()] : (hostConn&&hostConn.open?[hostConn.peer]:[])).map(id=>({peer:id,sameTab:false}))];
    const notify = joined => { const ps=list(); peerFns.forEach(f=>f({peers:ps,joined,left:[],updated:[]})); };
    const deliver = (from,raw) => { if(!raw||typeof raw!=="object") return; (handlers[raw.topic]||[]).forEach(f=>f({peer:from,sameTab:false,data:raw.data})); };
    const api = {
      emit(topic,data){
        const m={topic,data};
        if(isHost) conns.forEach(c=>{ if(c.open) c.send(m); });
        else if(hostConn&&hostConn.open) hostConn.send(m);
        return Promise.resolve();
      },
      on(topic,fn){ (handlers[topic]=handlers[topic]||[]).push(fn); return ()=>{}; },
      peers: list,
      onPeers(fn){ peerFns.push(fn); setTimeout(()=>fn({peers:list(),joined:list(),left:[],updated:[]}),0); return ()=>{}; },
      leave(){ try{ peer.destroy(); }catch(e){} return Promise.resolve(); },
    };
    peer.on("open", id=>{
      me=id;
      if(isHost){ done=true; return resolve(api); }
      hostConn = peer.connect(PEER_PREFIX+code.toLowerCase(), {reliable:true});
      hostConn.on("open", ()=>{ done=true; resolve(api); notify(list()); });
      hostConn.on("data", d=>deliver(hostConn.peer,d));
      hostConn.on("close", ()=>notify([]));
    });
    if(isHost) peer.on("connection", c=>{
      c.on("open", ()=>{ conns.set(c.peer,c); notify([{peer:c.peer,sameTab:false}]); });
      c.on("data", d=>deliver(c.peer,d));
      c.on("close", ()=>{ conns.delete(c.peer); notify([]); });
    });
    // si se corta con el servidor de enlace, se reintenta sin perder las conexiones abiertas
    peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch(e){} });
    peer.on("error", e=>{
      if(done) return;
      const why = e.type==="peer-unavailable" ? "No hay ninguna partida abierta con ese código."
        : e.type==="unavailable-id" ? "Ese código ya está en uso. Crea otra partida."
        : "No se ha podido conectar. Revisa tu internet e inténtalo de nuevo.";
      try{ peer.destroy(); }catch(_){}
      reject(new Error(why));
    });
    setTimeout(()=>{ if(!done){ try{ peer.destroy(); }catch(_){} reject(new Error("La conexión tarda demasiado. Comprueba el código e inténtalo de nuevo.")); } },15000);
  });
}

const POSL = ["POR","DEF","MED","DEL","DT"];
const NAME_IDX = Object.fromEntries(POOL.map((p,i)=>[p.n+"|"+p.pos,i]));
// goleadores y crónica: solo jugadores de campo, que no se repiten entre modos
const GOAL_IDX = Object.fromEntries(POOL.map((p,i)=>[p.n,i]).filter(([n,i])=>POOL[i].pos!=="DT"));
const pidx = x => NAME_IDX[x.n+"|"+x.pos] ?? (-1 - Math.max(0,POSL.indexOf(x.pos)));
const fromIdx = (i,price) => i>=0 ? {n:POOL[i].n,pos:POOL[i].pos,r:POOL[i].r,price} : {n:POSL[-1-i]==="DT"?"Segundo entrenador":"Canterano",pos:POSL[-1-i],r:62,price};
const gpack = g => [g.m, GOAL_IDX[g.n] ?? -1];
const gunpack = ([m,i]) => ({m, n: i>=0 ? POOL[i].n : "Canterano"});
const resPack = r => r && {...r, sh:r.sh.map(gpack), sa:r.sa.map(gpack), tl:r.tl&&r.tl.map(e=>[e[0],e[1],e[2],GOAL_IDX[e[3]]??-1])};
const resUnpack = r => r && {...r, sh:r.sh.map(gunpack), sa:r.sa.map(gunpack), tl:r.tl&&r.tl.map(e=>[e[0],e[1],e[2],e[3]>=0?POOL[e[3]].n:"Canterano"])};
function pack(){
  const o={...S, deck:undefined, dl:S.deck?S.deck.length:0, pz:paused, seq:NET.seq};
  if(S.m) o.m=S.m.map(m=>({b:m.budget,s:m.skips,r:m.roster.map(x=>[pidx(x),x.price,x.r])}));
  if(S.fx) o.fx=S.fx.map(f=>({h:f.h,a:f.a,j:f.j,live:f.live,res:resPack(f.res)}));
  if(S.playoff) o.playoff={...S.playoff,res:resPack(S.playoff.res)};
  // los mensajes de la sala tienen un límite de 4 KB: si no cabe, se quitan los goleadores
  const bytes=()=>new TextEncoder().encode(JSON.stringify(o)).length;
  // si no cabe, se quitan primero los goleadores de los partidos más antiguos
  if(o.fx) for(const f of o.fx){ if(bytes()<=1e9) break; /* sin límite de tamaño en la conexión directa */ if(f.res&&!f.live&&!f.res.tl){ f.res.sh=[]; f.res.sa=[]; } }
  return o;
}
function unpack(o){
  const s={...o};
  s.deck=new Array(o.dl||0); paused=!!o.pz;
  if(o.m) s.m=o.m.map(m=>({budget:m.b,skips:m.s,roster:m.r.map(([i,p,r])=>{ const x=fromIdx(i,p); if(r!=null) x.r=r; return x; })}));
  if(o.fx) s.fx=o.fx.map(f=>({h:f.h,a:f.a,j:f.j,live:f.live,res:resUnpack(f.res)}));
  if(o.playoff) s.playoff={...o.playoff,res:resUnpack(o.playoff.res)};
  return s;
}
function broadcast(){
  if(NET.role!=="host"||!NET.room) return;
  clearTimeout(btimer);
  btimer=setTimeout(()=>{ NET.seq++; NET.room.emit("state",pack()).catch(()=>{}); },40);
}
const mine = i => NET.role==="local" || i===NET.seat;
const cleanName = s => String(s||"").replace(/[\u0000-\u001f]/g,"").trim().slice(0,16) || "Invitado";
const genCode = () => Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");

// Acciones: en local y en el anfitrión se ejecutan; un invitado se las manda al anfitrión
const LOCAL = {
  bid:(mi,inc)=>bid(mi,inc), skip:mi=>skip(mi), pen:(mi,dir)=>penPick(mi,dir),
  pause:()=>togglePause(),
  lspeed:()=>liveSpeed(), lskip:()=>{ if(S.live&&!S.live.ended) endLive(); }, lclose:()=>{ if(S.live&&S.live.ended) closeLive(); },
  next:()=>{ if(S.phase==="auction"&&S.lot&&S.lot.sold) nextLot(); },
  minigo:()=>{ if(S.lot&&S.lot.mini) miniStart(); },
  play:()=>{ if(S.phase==="league") playNext(); }, all:()=>{ if(S.phase==="league") playAll(); },
  po:()=>{ if(S.playoff&&!S.playoff.res) playPlayoff(); }, replay:()=>{ if(S.phase==="final") replayLeague(); },
};
const SEATED = ["bid","skip","pen"];
function A(name,...args){
  if(NET.role!=="client") return LOCAL[name](...args);
  if(NET.seat<0) return;
  NET.room.emit("act",{a:name,args:SEATED.includes(name)?args.slice(1):args}).catch(()=>{});
}
function onAct(msg){
  if(!S||msg.sameTab) return;
  const d=msg.data||{}, seat=(S.seats||[]).findIndex(s=>s.peer===msg.peer);
  if(seat<0 || !LOCAL[d.a]) return;
  const args=Array.isArray(d.args)?d.args:[];
  if(SEATED.includes(d.a)) LOCAL[d.a](seat,...args); else LOCAL[d.a](...args);
}
function onHello(msg){
  if(!S||msg.sameTab) return;
  const name=cleanName(msg.data&&msg.data.name), seats=S.seats;
  if(seats.some(s=>s.peer===msg.peer)) return broadcast();
  const here=new Set(NET.room.peers().map(p=>p.peer));
  // alguien que recarga vuelve a su sitio por su nombre
  const back=seats.findIndex((s,k)=>k>0 && s.name===name && !here.has(s.peer));
  if(back>=0) seats[back].peer=msg.peer;
  else if((S.phase==="lobby"||S.phase==="auction") && seats.length<MAXP){
    let nm=name, n=2; while(seats.some(s=>s.name===nm)) nm=(name+" "+n++).slice(0,16);
    seats.push({peer:msg.peer,name:nm});
    S.names=seats.map(s=>s.name);
    if(S.phase==="auction") addManager(nm);
  }
  save(); if(S.phase==="lobby") renderLobby(); else if(S.phase==="auction") renderAuction();
}
async function joinRoom(code){
  const r=await ROOM.join("sub-"+code.toLowerCase());
  NET.room=r; NET.code=code;
  r.onPeers(ch=>{
    const me=ch.peers.find(p=>p.sameTab); if(me) NET.myPeer=me.peer;
    if(NET.role==="host" && ch.joined.length) broadcast();
    if(NET.role==="client" && S) { NET.seat=(S.seats||[]).findIndex(s=>s.peer===NET.myPeer); }
    netbar();
  });
  return r;
}
async function hostGame(name, resume){
  const code=resume?resume.code:genCode();
  NET.role="host"; NET.seat=0;
  try{ await joinRoom(code); }catch(e){ NET.role="local"; return setupMsg(e.message||"No se ha podido abrir la sala. Inténtalo de nuevo."); }
  NET.room.on("hello",onHello); NET.room.on("act",onAct);
  clearInterval(hbtimer); hbtimer=setInterval(broadcast,2500);
  if(resume){ S=resume; return route(); }
  S={phase:"lobby", code, seats:[{peer:null,name:cleanName(name),host:true}], names:[cleanName(name)], laps, mode};
  save(); renderLobby();
}
async function joinGame(code,name){
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==4) return setupMsg("El código tiene 4 letras o números.");
  NET.role="client"; NET.name=cleanName(name); S=null;
  try{ await joinRoom(code); }catch(e){ NET.role="local"; return setupMsg(e.message||"No se ha podido entrar en esa sala."); }
  let prevClues=0;
  NET.room.on("state",msg=>{
    const o=msg.data; if(!o||o.code!==NET.code) return;
    if(NET.hostPeer && msg.peer!==NET.hostPeer) return;
    if(NET.hostPeer===msg.peer && o.seq<=NET.seq) return;
    NET.hostPeer=msg.peer; NET.seq=o.seq; NET.lastAt=Date.now();
    S=unpack(o); NET.seat=S.seats.findIndex(s=>s.peer===NET.myPeer);
    if(S.phase==="lobby") renderLobby();
    else if(S.phase==="auction"){ const nc=S.lot.clues!==prevClues; prevClues=S.lot.clues; renderAuction(false,nc); }
    else renderLeague();
    netbar();
  });
  const hello=()=>{ if(NET.role==="client" && NET.seat<0) NET.room.emit("hello",{name:NET.name}).catch(()=>{}); };
  hello(); clearInterval(hbtimer); hbtimer=setInterval(()=>{ hello(); netbar(); },2000);
  app.innerHTML=`<section class="box"><span class="label">Sala ${esc(code)}</span><h2 style="font-size:2rem">Buscando al anfitrión…</h2><p class="note">Si tarda, comprueba el código y que el anfitrión tenga la partida abierta.</p></section>`;
  netbar();
}
function leaveOnline(){
  clearInterval(hbtimer); if(NET.room) NET.room.leave().catch(()=>{});
  Object.assign(NET,{role:"local",room:null,code:"",seat:-1,myPeer:null,hostPeer:null,seq:0,lastAt:0});
  S=null; netbar(); renderSetup();
}
function netbar(){
  const el=document.getElementById("netbar"); if(!el) return;
  if(NET.role==="local"){ el.hidden=true; return; }
  el.hidden=false;
  const who = NET.seat>=0 && S && S.seats && S.seats[NET.seat] ? `Eres <b style="color:${COLORS[NET.seat]}">${esc(S.seats[NET.seat].name)}</b>` : (NET.role==="client"&&S?"Estás mirando":"Conectando…");
  const lost = NET.role==="client" && NET.lastAt && Date.now()-NET.lastAt>8000;
  el.innerHTML=`<span>Online · sala <b class="mono">${esc(NET.code)}</b> · ${NET.role==="host"?"Eres el anfitrión":who}</span>${lost?`<span style="color:var(--bad)">Sin señal del anfitrión</span>`:""}<button class="btn ghost sm" id="leave">Salir</button>`;
  document.getElementById("leave").onclick=leaveOnline;
}
function setupMsg(t){ const el=document.getElementById("onmsg"); if(el) el.textContent=t; }
function renderLobby(){
  stop();
  const seats=S.seats, isHost=NET.role==="host";
  app.innerHTML=`
  <header class="hero"><span class="label">Sala de espera · modo ${MODES[S.mode||"pistas"]}</span><h1>Código <span class="mono">${esc(S.code)}</span></h1>
    <p>Pasa este código a tus amigos (de 2 a 4 mánagers). Solo tienen que abrir este mismo enlace, escribir el código y pulsar <b>Unirse</b>.</p></header>
  <section class="teams">${[0,1,2,3].map(i=>`<div class="team" style="--c:${COLORS[i]}"><div class="top"><span class="nm">${seats[i]?esc(seats[i].name):"Libre"}</span><span class="note">${seats[i]?(seats[i].host?"Anfitrión":"Listo"):"Esperando…"}</span></div><span class="note">Mánager ${i+1}</span></div>`).join("")}</section>
  ${isHost?`<div class="box"><span class="label">Liga</span>
      <div class="seg" id="laps"><button data-l="2" aria-pressed="${S.laps===2}">Ida y vuelta</button><button data-l="4" aria-pressed="${S.laps===4}">Doble vuelta</button></div>
      <span class="label">Modo de juego</span>${modeSeg(S.mode||"pistas","modes")}
      <div class="row"><button class="btn amber" id="gostart" ${seats.length<MINP?"disabled":""}>Empezar subasta</button><span class="note">${seats.length<MINP?"Hace falta al menos otro mánager":`Sois ${seats.length}. ${seats.length<MAXP?"Se puede seguir uniendo gente, también con la subasta empezada.":"Sala completa."}`}</span></div></div>`
    :`<p class="note">Esperando a que el anfitrión empiece la subasta.</p>`}`;
  if(isHost){
    app.querySelectorAll("#laps button").forEach(b=>b.onclick=()=>{S.laps=+b.dataset.l;save();renderLobby()});
    app.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();renderLobby()});
    document.getElementById("gostart").onclick=()=>{ names=S.seats.map(s=>s.name); laps=S.laps; mode=S.mode||"pistas"; startAuction(); };
  }
}

      <p class="note">${MODES[mode]}: ${Object.keys(SLOTS).map(k=>POOL.filter(p=>inMode(p,mode)&&p.pos===k).length+" "+k).join(" · ")}.</p>
    </div>
  </section>`;
  app.querySelectorAll("#laps button").forEach(b=>b.onclick=()=>{readNames();laps=+b.dataset.l;renderSetup()});
  app.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{readNames();mode=b.dataset.mode;renderSetup()});
  app.querySelectorAll("#np button").forEach(b=>b.onclick=()=>{ readNames(); const n=+b.dataset.n; names=Array.from({length:n},(_,i)=>names[i]||DEFAULT_NAMES[i]); renderSetup(); });
  document.getElementById("start").onclick=()=>{readNames();startAuction()};
  const r=document.getElementById("resume"); if(r) r.onclick=()=>{ if(saved.code&&ROOM) return hostGame(saved.seats[0].name,saved); S=saved; route(); };
  // El nombre se pide justo al crear o unirse
  const step=document.getElementById("namestep");
  const askName=(label,go)=>{
    setupMsg("");
    document.getElementById("namelabel").textContent=label;
    document.getElementById("namego").textContent=go.text;
    const inp=document.getElementById("on-name");
    try{ inp.value=localStorage.getItem("subasta-name")||""; }catch(e){}
    step.hidden=false; inp.focus(); inp.select();
    step.onsubmit=e=>{ e.preventDefault(); const nm=inp.value.trim(); if(!nm){ setupMsg("Escribe tu nombre para continuar."); return inp.focus(); }
      try{ localStorage.setItem("subasta-name",nm); }catch(_){} step.hidden=true; go.run(nm); };
  };
  const h=document.getElementById("host");
  if(h) h.onclick=()=>askName("¿Cómo te llamas? Serás el anfitrión de la sala.",{text:"Crear sala",run:nm=>hostGame(nm)});
  const j=document.getElementById("join");
  if(j) j.onclick=()=>{
    const code=document.getElementById("on-code").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(code.length!==4){ step.hidden=true; return setupMsg("Escribe primero el código de 4 letras o números que te han pasado."); }
    askName(`¿Cómo te llamas? Vas a entrar en la sala ${code}.`,{text:"Entrar",run:nm=>joinGame(code,nm)});
  };
  const nc=document.getElementById("namecancel"); if(nc) nc.onclick=()=>{ step.hidden=true; setupMsg(""); };
  const oc=document.getElementById("on-code"); if(oc) oc.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); j.click(); } };
}
function readNames(){ names=names.map((_,i)=>{ const el=document.getElementById("m"+i); return (el&&el.value.trim())||"Mánager "+(i+1); }); }

// ---------- Subasta ----------
const SKIPS = 3, SKIPKEYS = ["t","b","p","5"];
function startAuction(){
  const online = NET.role==="host" ? {code:S.code, seats:S.seats} : {};
  S = {phase:"auction", names, laps, m:names.map(()=>({budget:BUDGET, roster:[], skips:SKIPS})), mode, deck:shuffle(POOL.map((_,i)=>i).filter(i=>inMode(POOL[i],mode))), di:-1, lot:null, sales:0, ...online};
  nextLot();
}
const count = (m,pos) => m.roster.filter(x=>x.pos===pos).length;
const needs = (m,pos) => SLOTS[pos]-count(m,pos);
const free = m => SQUAD - m.roster.length;
// siempre tiene que quedar 10 M por cada hueco libre
const maxBid = m => m.budget - (free(m)-1)*MINP_SLOT;
function anyoneNeeds(pos){ return S.m.some(m=>needs(m,pos)>0 && maxBid(m)>=MINP_SLOT); }
// Puede entrar en este lote: necesita el puesto y llega al precio de salida
const eligible = mi => { const L=S.lot, m=S.m[mi]; return needs(m,POOL[L.pi].pos)>0 && maxBid(m)>=L.salida; };
// Quien no puja ni pasa: si nadie puja, a estos les toca el jugador
const stuck = () => idx().filter(i=>eligible(i) && !S.lot.skipped[i]);
// alguien se une a mitad de subasta: equipo nuevo con presupuesto completo; el lote en juego no le obliga
function addManager(name){
  S.m.push({budget:BUDGET, roster:[], skips:SKIPS});
  if(S.lot && !S.lot.sold) S.lot.skipped[S.m.length-1]=true;
}

// Quien se queda sin dinero (solo le queda lo justo para completar) recibe los descartes que nadie quiso, a 10 M
const broke = m => free(m)>0 && m.budget-free(m)*MINP_SLOT < MINP_SLOT;
function giveDiscards(all){
  const gifts=[]; S.discards=S.discards||[];
  idx().forEach(i=>{
    const m=S.m[i]; if(!all&&!broke(m)) return;
    for(let d=0; d<S.discards.length; ){
      const p=POOL[S.discards[d]];
      if(needs(m,p.pos)>0 && m.budget>=MINP_SLOT){
        m.budget-=MINP_SLOT; m.roster.push({n:p.n,pos:p.pos,r:p.r,price:MINP_SLOT});
        gifts.push({t:i,pi:S.discards[d]}); S.discards.splice(d,1);
      } else d++;
    }
  });
  return gifts;
}
function nextLot(){
  stopMini();
  const gifts=giveDiscards(false);
  if(S.m.every(m=>free(m)===0)) return toLeague();
  do { S.di++; } while(S.di < S.deck.length && !anyoneNeeds(POOL[S.deck[S.di]].pos));
  if(S.di >= S.deck.length) return toLeague();
  const pos=POOL[S.deck[S.di]].pos;
  // salida al azar, sin relación con la media del jugador
  const reach=Math.max(...S.m.filter(m=>needs(m,pos)>0).map(maxBid));
  const salida=Math.max(MINP_SLOT,Math.min(reach, 10+5*Math.floor(Math.random()*14)));
  S.lot = {pi:S.deck[S.di], salida, clues:1, bid:0, leader:-1, cd:0, idle:0, skipped:S.m.map(()=>false), sold:null, mini:null, msg:"", ct:CLUE_T};
  if(S.sales>=2) S.lot.ev=rollEvent(EVENTS,EV_CHANCE);
  if(gifts.length) S.lot.gifts=gifts;
  S.phase = "auction"; paused = false;
  save(); renderAuction(true); run();
}
const priceFor = inc => S.lot.leader<0 ? S.lot.salida + (inc===INCS[0]?0:inc) : S.lot.bid+inc;
function why(mi){
  const L=S.lot, m=S.m[mi], pos=POOL[L.pi].pos;
  if(needs(m,pos)<=0) return `Ya tiene ${pos==="DT"?"entrenador":"todos los "+pos}`;
  if(maxBid(m)<L.salida) return `No llega a la salida (máx. ${maxBid(m)} M)`;
  if(L.skipped[mi]) return "Ha pasado de este jugador";
  if(L.leader===mi) return "Va ganando";
  if(maxBid(m)<priceFor(1)) return `Puja máxima: ${maxBid(m)} M`;
  return `Puede llegar a ${maxBid(m)} M`;
}
function canRaise(mi,inc){
  const L=S.lot;
  return !L.sold && !L.mini && !paused && L.leader!==mi && !L.skipped[mi] && eligible(mi) && priceFor(inc)<=maxBid(S.m[mi]);
}
function canSkip(mi){
  const L=S.lot;
  return !L.sold && !L.mini && !paused && L.leader<0 && !L.skipped[mi] && eligible(mi) && S.m[mi].skips>0;
}
function bid(mi,inc){
  const L=S.lot; if(!L || L.sold || L.mini || S.phase!=="auction") return;
  if(L.leader===mi){ L.msg=`${S.names[mi]} ya va ganando la puja.`; return renderAuction(); }
  if(!canRaise(mi,inc)){ L.msg=`${S.names[mi]} no puede pujar ${priceFor(inc)} M. ${why(mi)}.`; return renderAuction(); }
  L.bid=priceFor(inc); L.leader=mi; L.cd=cdMax(L); L.idle=0; L.msg="";
  save(); renderAuction();
}
const cdMax = L => L.fast ? 4 : CD;
function skip(mi){
  const L=S.lot; if(!L || L.sold || L.mini || S.phase!=="auction") return;
  if(!canSkip(mi)){
    L.msg = L.leader>=0 ? "Ya hay una puja: no hace falta pasar." : S.m[mi].skips<=0 ? `${S.names[mi]} no tiene skips.` : `${S.names[mi]} no puede pasar ahora.`;
    return renderAuction();
  }
  S.m[mi].skips--; L.skipped[mi]=true; L.msg=`${S.names[mi]} pasa. Le quedan ${S.m[mi].skips} skips.`;
  if(stuck().length===0) return resolveNoBid();
  save(); renderAuction();
}
function assign(mi,price,via){
  const L=S.lot, p=POOL[L.pi], m=S.m[mi];
  m.budget-=price; m.roster.push({n:p.n,pos:p.pos,r:p.r,price});
  L.sold={to:mi,price,via}; S.sales++;
  L.clues=4; stop(); save(); renderAuction();
}
function sell(){
  const L=S.lot;
  if(L.leader>=0) return assign(L.leader,Math.min(L.bid+(L.tax||0),Math.max(L.bid,maxBid(S.m[L.leader]))),"puja");
  resolveNoBid();
}
function resolveNoBid(){
  const L=S.lot, c=stuck();
  if(c.length===0){ L.sold={to:-1}; L.clues=4; (S.discards=S.discards||[]).push(L.pi); stop(); save(); return renderAuction(); }
  if(c.length===1) return assign(c[0],L.salida,"obligado");
  stop(); L.mini=newMini(c);
  save(); renderAuction();
}
function togglePause(){ if(!S.lot||S.lot.sold) return; paused=!paused; save(); renderAuction(); }
function run(){
  stop();
  if(NET.role==="client") return;
  timer=setInterval(()=>{
    const L=S&&S.lot; if(!L||L.sold||L.mini||paused||S.phase!=="auction") return;
    // con una puja en marcha la cuenta atrás corre aunque falten pistas
    // con puja: cuenta atrás de venta. Sin puja: la barra baja y sale la siguiente pista
    if(L.leader>=0){ L.cd--; if(L.cd<=0) return sell(); }
    else if(L.clues<4&&!L.blind){
      L.ct=(L.ct??CLUE_T)-1;
      if(L.ct<=0){ L.clues++; L.ct=CLUE_T; if(L.clues===4) L.idle=0; save(); return renderAuction(false,true); }
    }
    else { L.idle++; if(L.idle>=IDLE_LIMIT) return resolveNoBid(); }
    tickUI(); broadcast();
  },1000);
}
function revealClue(){
  const L=S&&S.lot; if(!L||L.sold||L.mini||paused||L.clues>=4) return;
  if(L.blind){ L.msg="Subasta a ciegas: no hay más pistas para este jugador."; return renderAuction(); }
  L.clues++;
  if(L.clues===4) L.idle=0;
  save(); renderAuction(false,true);
}
function stop(){ if(timer){clearInterval(timer);timer=null;} }

// ---------- Minijuego: tanda de penaltis ----------
// Duelo entre dos: se turnan para chutar y parar, 3 tiros cada uno y muerte súbita.
// El que pierde el duelo sigue en peligro contra el siguiente; el último perdedor se queda el jugador.
// Las elecciones se guardan fuera del estado compartido para que nadie las vea antes de tiempo.
const PEN_T = 10, DIRS = ["Izquierda","Centro","Derecha"], DT = ["a la izquierda","al centro","a la derecha"], DIRKEYS = ["arrowleft","arrowdown","arrowright"];
let miniTimer=null, penPicks={};
function stopMini(){ if(miniTimer){ clearInterval(miniTimer); clearTimeout(miniTimer); miniTimer=null; } }
function newMini(who){
  const q=shuffle(who);
  return {who, a:q[0], b:q[1], queue:q.slice(2), safe:[], phase:"ready", g:{}, k:{}, hist:[], t:PEN_T, ready:{sh:false,gk:false}, last:null};
}
const shooter = M => (M.k[M.a]||0) <= (M.k[M.b]||0) ? M.a : M.b;
const keeper  = M => shooter(M)===M.a ? M.b : M.a;
function miniStart(){
  const M=S.lot.mini; if(!M||M.phase!=="ready") return;
  startKick(M);
}
function startKick(M){
  stopMini(); penPicks={};
  M.phase="kick"; M.t=PEN_T; M.ready={sh:false,gk:false}; M.sh=shooter(M); M.gk=keeper(M);
  save(); renderAuction();
  if(NET.role==="client") return;
  miniTimer=setInterval(()=>{
    if(M.phase!=="kick"){ stopMini(); return; }
    M.t--;
    if(M.t<=0){ // quien no elija, elige al azar
      if(penPicks.sh==null) penPicks.sh=Math.floor(Math.random()*3);
      if(penPicks.gk==null) penPicks.gk=Math.floor(Math.random()*3);
      return resolveKick(M);
    }
    save(); renderAuction();
  },1000);
}
function penPick(mi,dir){
  const M=S.lot&&S.lot.mini; if(!M||M.phase!=="kick") return;
  dir=+dir; if(!(dir>=0&&dir<=2)) return;
  if(mi===M.sh&&penPicks.sh==null){ penPicks.sh=dir; M.ready.sh=true; }
  else if(mi===M.gk&&penPicks.gk==null){ penPicks.gk=dir; M.ready.gk=true; }
  else return;
  if(penPicks.sh!=null&&penPicks.gk!=null) return resolveKick(M);
  save(); renderAuction();
}
function resolveKick(M){
  stopMini();
  const sd=penPicks.sh, gd=penPicks.gk, goal=sd!==gd;
  M.k[M.sh]=(M.k[M.sh]||0)+1; if(goal) M.g[M.sh]=(M.g[M.sh]||0)+1;
  M.last={sh:M.sh,gk:M.gk,sd,gd,goal}; M.hist.push([M.sh,goal?1:0]);
  M.phase="result"; save(); renderAuction();
  if(NET.role==="client") return;
  miniTimer=setTimeout(()=>{
    const ga=M.g[M.a]||0, gb=M.g[M.b]||0, ka=M.k[M.a]||0, kb=M.k[M.b]||0;
    let loser=null;
    if(ka<=3&&kb<=3){ if(ga>gb+(3-kb)) loser=M.b; else if(gb>ga+(3-ka)) loser=M.a; }
    if(loser==null&&ka===kb&&ka>=3&&ga!==gb) loser=ga<gb?M.a:M.b;
    if(loser==null) return startKick(M);
    const winner=loser===M.a?M.b:M.a;
    M.safe.push(winner);
    if(M.queue.length){ // el que pierde sigue en peligro contra el siguiente
      M.a=loser; M.b=M.queue.shift(); M.g={}; M.k={}; M.hist=[]; M.last=null; M.duelMsg=winner;
      M.phase="ready"; save(); renderAuction(); return;
    }
    miniEnd(loser);
  },2200);
}
function miniEnd(loser){
  stopMini();
  const M=S.lot.mini; M.phase="done"; M.loser=loser;
  assign(loser,S.lot.salida,"minijuego");
}
function pressPen(mi,dir){ const M=S&&S.lot&&S.lot.mini; if(!M||!mine(mi)||M.phase!=="kick") return; A("pen",mi,dir); }
function miniHTML(){
  const M=S.lot.mini, nb=i=>`<b style="color:${COLORS[i]}">${esc(S.names[i])}</b>`;
  const sh=M.phase==="ready"?shooter(M):M.sh, gk=M.phase==="ready"?keeper(M):M.gk;
  const dots=i=>{ const h=M.hist.filter(x=>x[0]===i).map(x=>`<span class="pdot ${x[1]?"in":"out"}"></span>`); while(h.length<3) h.push(`<span class="pdot"></span>`); return h.join(""); };
  const score=`<div class="pscore">
      <div class="pside">${nb(M.a)}<span class="pdots">${dots(M.a)}</span></div>
      <span class="mono pnum">${M.g[M.a]||0} – ${M.g[M.b]||0}</span>
      <div class="pside r">${nb(M.b)}<span class="pdots">${dots(M.b)}</span></div></div>`;
  const roles=`<div class="duel">
      <div class="role" style="--c:${COLORS[sh]}"><span class="label">Chuta</span><b>${esc(S.names[sh])}</b>${NET.role!=="local"&&mine(sh)?`<span class="you">tú</span>`:""}</div>
      <span class="vsx">vs</span>
      <div class="role" style="--c:${COLORS[gk]}"><span class="label">Portero</span><b>${esc(S.names[gk])}</b>${NET.role!=="local"&&mine(gk)?`<span class="you">tú</span>`:""}</div></div>`;
  const zones=(M.phase==="result"&&M.last)?[0,1,2].map(z=>`<div class="zone">${z===M.last.gd?`<span class="glove ${M.last.goal?"":"saved"}" id="glove"></span>`:""}${z===M.last.sd?`<span class="pball ${M.last.goal?"goal":""}" id="pball"></span>`:""}</div>`).join(""):[0,1,2].map(()=>`<div class="zone"></div>`).join("");
  const goalBox=`<div class="pgoal ${M.phase==="result"?(M.last.goal?"is-goal":"is-save"):""}" id="pgoal">${zones}</div>`;
  let body="";
  if(M.phase==="ready"){
    const others=M.queue.length?`<p class="note" style="margin:0">Esperan turno: ${M.queue.map(nb).join(", ")}. ${M.safe.length?`A salvo: ${M.safe.map(nb).join(", ")}.`:""}</p>`:(M.safe.length?`<p class="note" style="margin:0">A salvo: ${M.safe.map(nb).join(", ")}.</p>`:"");
    body=`${M.duelMsg!=null?`<p style="margin:0">${nb(M.duelMsg)} gana su duelo y se salva. ${nb(M.a)} sigue en peligro.</p>`:`<p style="margin:0">Nadie ha pujado y ${M.who.map(nb).join(", ").replace(/, ([^,]*)$/," y $1")} no han pasado. Se juega a penaltis quién se queda el jugador por <b>${S.lot.salida} M</b>.</p>`}
      <p class="note" style="margin:0">3 tiros cada uno y, si hay empate, muerte súbita. Quien chuta y quien para eligen a la vez y en secreto: izquierda, centro o derecha. Si coinciden, ¡parada! Quien pierda la tanda se lo queda.</p>
      ${others}<button class="btn amber" id="minigo">Empezar la tanda: ${esc(S.names[M.a])} vs ${esc(S.names[M.b])}</button>`;
  } else if(M.phase==="kick"){
    const st=(ok,i,verb)=>`<span class="pst ${ok?"ok":""}">${esc(S.names[i])} ${ok?"ya ha elegido":verb}</span>`;

      return `<div class="pctrl" style="--c:${COLORS[i]}"><span class="label">${NET.role==="local"?esc(S.names[i])+": ":""}${role==="sh"?"¿Dónde chutas?":"¿Hacia dónde te tiras?"}</span>
        <div class="pbtns">${DIRS.map((d,z)=>`<button class="bid" data-pen="${i}" data-dir="${z}">${d}<kbd>${keys[z]}</kbd></button>`).join("")}</div></div>`;
    };
    body=`<div class="cdbar ${M.t<=3?"hot":""}"><i style="width:${M.t/PEN_T*100}%"></i></div>
      <div class="pstatus">${st(M.ready.sh,M.sh,"pensando dónde chutar…")}${st(M.ready.gk,M.gk,"pensando hacia dónde tirarse…")}</div>
      ${ctrl(M.sh,"sh")}${ctrl(M.gk,"gk")}
      ${NET.role!=="local"&&!mine(M.sh)&&!mine(M.gk)?`<p class="note" style="margin:0">Estás mirando este penalti.</p>`:""}`;
  } else if(M.phase==="result"){
    const L=M.last;
    body=`<div class="presult ${L.goal?"goal":"save"}">${L.goal?`¡GOL de ${esc(S.names[L.sh])}!`:`¡PARADA de ${esc(S.names[L.gk])}!`}</div>
      <p class="note" style="margin:0;text-align:center">Chutó ${DT[L.sd]} · el portero se tiró ${DT[L.gd]}</p>`;
  }
  return `<div class="minibox"><span class="label">Minijuego · tanda de penaltis</span>${roles}${score}${goalBox}${body}</div>`;
}

// ---------- Pantalla de subasta ----------
// En online cada uno usa Q W E R para pujar y T para el skip con su propio mánager
const keysOf = i => NET.role==="local" ? KEYS[i] : KEYS[0];
const skipKeyOf = i => NET.role==="local" ? SKIPKEYS[i] : SKIPKEYS[0];
function callText(L){
  const left=4-L.clues, faltan=`falta${left>1?"n":""} ${left} pista${left>1?"s":""}`;
  if(L.leader<0) return left>0&&!L.blind ? `Siguiente pista en ${L.ct??CLUE_T} s · ${faltan}` : `Sin pujas · se resuelve en ${IDLE_LIMIT-L.idle} s`;
  if(L.cd<=2) return "¡A las dos…!";
  if(L.cd<=5) return "A la una…";
  return `Puja de ${S.names[L.leader]}`;
}
// Qué mide la barra: venta (con puja), próxima pista o tiempo para resolver sin pujas
function barState(L){
  if(L.sold||L.mini) return {w:0,mode:""};
  if(L.leader>=0) return {w:L.cd/cdMax(L)*100, mode:L.cd<=3?"hot":""};
  if(L.clues<4&&!L.blind) return {w:(L.ct??CLUE_T)/CLUE_T*100, mode:"clue"};
  return {w:(IDLE_LIMIT-L.idle)/IDLE_LIMIT*100, mode:"idle"};
}
function tickUI(){
  const L=S.lot, c=document.getElementById("call"), bar=document.getElementById("cd");
  const live=L.leader>=0;
  if(c){ c.textContent=callText(L); c.classList.toggle("hot",live&&L.cd<=2); }
  if(bar){ const b=barState(L); bar.style.width=b.w+"%"; bar.parentNode.className="cdbar "+b.mode; }
  react();
}
function teamsHTML(lead=-1){
  return `<div class="teams">${S.m.map((m,i)=>`
    <div class="team ${lead===i?"lead":""}" id="team${i}" style="--c:${COLORS[i]}">
      <div class="top"><span class="nm">${esc(S.names[i])}</span><span class="money">${m.budget} M</span></div>
      <div class="slots">${Object.keys(SLOTS).map(k=>`<span class="slot ${count(m,k)>=SLOTS[k]?"full":""}">${k} ${count(m,k)}/${SLOTS[k]}</span>`).join("")}<span class="slot skips">Skips ${m.skips??0}/${SKIPS}</span></div>
      <div class="roster">${m.roster.length?m.roster.map(x=>`<div><span class="ps">${x.pos}</span><span>${esc(x.n)} <span class="pr">· ${x.r}</span></span><span class="pr">${x.price} M</span></div>`).join(""):`<span class="note">Sin fichajes todavía</span>`}</div>
    </div>`).join("")}</div>`;
}
function soldLabel(L){
  const s=L.sold, nm=s.to>=0?esc(S.names[s.to]):"";
  if(s.to<0) return "Nadie lo quiere · va a la pila de descartes";
  if(s.via==="obligado") return `Nadie pujó y ${nm} no pasó: se lo queda por ${s.price} M`;
  if(s.via==="minijuego") return `${nm} pierde el minijuego y se lo queda por ${s.price} M`;
  return `Vendido a ${nm} por ${s.price} M`;
}
function renderAuction(fresh=false, newClue=false){

function toLeague(){
